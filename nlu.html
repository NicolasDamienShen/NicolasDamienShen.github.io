HANDLERS.volume = function(s, p, fx, warn) {
    if (p.action === "query") {
        const t = p.target || "media";
        const v = k => s.muted[k] ? "mute" : s.vol[k];
        fx.push({
            kind: "status",
            title: `${t} volume: ${v(t)}`,
            sub: p.target ? `media ${v("media")} · navigate ${v("navigate")} · voice ${v("voice")} · system ${v("system")}` : `navigate ${v("navigate")} · voice ${v("voice")} · system ${v("system")} · phone ${v("phone")}`,
            icon: "♪",
            color: "#3fd2ff"
        });
        return;
    }
    for (const k of [ "action", "target" ]) if (p[k] != null && !VOL_S[k].includes(p[k])) {
        warn.push(`volume.${k} value “${p[k]}” is not in the schema , ignored`);
        delete p[k];
    }
    if (p.degree != null && num(p.degree, [ 0, 99 ]) == null) {
        warn.push(`volume.degree“${p.degree}” is not a number, ignored`);
        delete p.degree;
    }
    const act = p.action || (p.degree != null ? "set" : null), t = p.target || "media";
    if (!act) {
        warn.push("volume: missing action");
        return;
    }
    if (act === "mute") {
        s.muted[t] = true;
        fx.push({
            kind: "volume",
            target: t
        });
        return;
    }
    if (act === "unmute") {
        s.muted[t] = false;
        fx.push({
            kind: "volume",
            target: t
        });
        return;
    }
    const d = p.degree === "min" ? 1 : num(p.degree, RANGE.volume), cur = s.vol[t];
    if (act === "set") {
        if (d == null) {
            warn.push("volume: set is missing degree");
            return;
        }
        s.vol[t] = clamp(d, RANGE.volume);
    } else if (act === "increase") s.vol[t] = clamp(cur + (d == null ? 5 : d), RANGE.volume); else if (act === "decrease") s.vol[t] = clamp(cur - (d == null ? 5 : d), RANGE.volume);
    s.muted[t] = s.vol[t] <= 1;
    fx.push({
        kind: "volume",
        target: t
    });
};

HANDLERS.general = function(s, p, fx, warn) {
    let a = p.action, idx = parseInt(p.index) || 0;
    const sc = s.screen;
    if (a === "close" || a === "off") a = "exit";
    if (a === "open" || a === "on" || a === "view") {
        s.list = listFor(s, p.object);
        s.screen = "list";
        fx.push({
            kind: "list"
        });
        return;
    }
    const close = () => {
        if (sc === "app") s.app = null;
        if (sc === "nav") s.nav.active = false;
        if (sc === "phone") s.phone.active = false;
        if (sc === "video" && s.video) s.video.playing = false;
        s.screen = "idle";
        fx.push({
            kind: "screen"
        });
    };
    if ([ "cancel", "back", "exit", "home" ].includes(a)) {
        if (sc !== "idle") {
            if (a === "exit" || a === "home") {
                s.list = null;
            }
            close();
        } else fx.push({
            kind: "status",
            title: a,
            sub: "No screen is open",
            icon: "⟳",
            color: "#8a93a3"
        });
        return;
    }
    if (a === "retry") {
        if (s.lastCmd && HANDLERS[s.lastCmd.tool]) {
            const c = parseDSL(s.lastCmd.line)[0];
            HANDLERS[c.tool](s, c.params, fx, warn);
            return;
        }
        if (s.list) {
            s.list.page = 0;
            s.list.sel = -1;
            s.screen = "list";
            fx.push({
                kind: "list"
            });
            return;
        }
        fx.push({
            kind: "status",
            title: "retry",
            sub: "Nothing to retry",
            icon: "⟳",
            color: "#8a93a3"
        });
        return;
    }
    if (a === "stop") {
        const L = s.last;
        if (L && L.tool === "general") {
            fx.push({
                kind: "status",
                title: "Stopped",
                sub: s.list ? s.list.title : "",
                icon: "■",
                color: "#8a93a3"
            });
            return;
        }
        if (L && [ "ac", "seat", "light", "win", "shade" ].includes(L.tool)) {
            const c = parseDSL(L.line)[0];
            const q = {
                action: "off"
            };
            for (const k of [ "zone", "mode", "target" ]) if (c.params[k]) q[k] = c.params[k];
            if (L.tool === "win" || L.tool === "shade" || L.tool === "light") delete q.target;
            if (L.tool === "light") delete q.mode;
            HANDLERS[L.tool](s, q, fx, warn);
            return;
        }
        if (s.video && s.video.playing && (sc === "video" || !s.music.playing)) {
            s.video.playing = false;
            s.screen = "video";
            fx.push({
                kind: "video"
            });
            return;
        }
        if (s.music.playing) {
            s.music.playing = false;
            if (sc === "idle") s.screen = "music";
            fx.push({
                kind: "music"
            });
            return;
        }
        fx.push({
            kind: "status",
            title: "Stopped",
            sub: "",
            icon: "■",
            color: "#8a93a3"
        });
        return;
    }
    if (a === "play" || a === "pause") {
        if (a === "play" && idx && s.list) {
            s.list.sel = idx - 1;
            const it = s.list.items[idx - 1];
            if (it) {
                if (s.list.kind === "shows") {
                    s.video = {
                        name: it.name,
                        ep: "1",
                        type: it.meta,
                        actor: "",
                        source: "iQIYI",
                        playing: true,
                        pos: 0,
                        dur: 5400
                    };
                    s.screen = "video";
                } else {
                    s.music.song = it.name;
                    s.music.playing = true;
                    s.screen = "music";
                }
                fx.push({
                    kind: "list"
                });
                return;
            }
        }
        if (s.video && (sc === "video" || !s.music.playing)) {
            s.video.playing = a === "play";
            s.screen = "video";
            fx.push({
                kind: "video"
            });
            return;
        }
        s.music.playing = a === "play";
        if (s.screen === "idle") s.screen = "music";
        fx.push({
            kind: "music"
        });
        return;
    }
    if (!s.list && (a === "save" || a === "share") && !p.object) {
        fx.push({
            kind: "status",
            title: a === "save" ? "Current settings saved" : "Shared",
            sub: s.last ? s.last.line : "",
            icon: a === "save" ? "✓" : "↗",
            color: "#3fd2ff"
        });
        return;
    }
    if (!s.list) s.list = listFor(s, p.object);
    const L = s.list, pages = Math.max(1, Math.ceil(L.items.length / PAGE));
    if (a === "next page" || a === "swipe down") L.page = Math.min(pages - 1, L.page + 1); else if (a === "previous page" || a === "swipe up") L.page = Math.max(0, L.page - 1); else if (a === "page N") L.page = Math.max(0, Math.min(pages - 1, (idx || 1) - 1)); else if (a === "last page") L.page = pages - 1; else if (a === "item N") {
        L.sel = Math.max(0, Math.min(L.items.length - 1, (idx || 1) - 1));
        L.page = Math.floor(L.sel / PAGE);
    } else if (a === "last item") {
        L.sel = L.items.length - 1;
        L.page = pages - 1;
    } else if (a === "save" || a === "share") {
        if (idx) {
            L.sel = Math.max(0, Math.min(L.items.length - 1, idx - 1));
            L.page = Math.floor(L.sel / PAGE);
        }

    $("track").innerHTML = h;
}

function paintTry() {
    const q = normS($("chatIn").value), all = demoList();
    const hit = all.filter(s => !q || normS(s).includes(q));
    $("tryList").innerHTML = (hit.length ? "" : `<div class="none">${esc(T("noMatch"))}</div>`) + (hit.length ? hit : all).map(s => `<button type="button">${esc(s)}</button>`).join("");
}

function paintAll() {
    paintSteps();
    paintBar();
    paintLog();
    paintTry();
}

function clearCabin() {
    gen++;
    busy = false;
    cur = null;
    logItems = [];
    lastResult = null;
    clearRings();
    clearTimeout(statusTimer);
    state = initialState();
    state.model = pipeline;
    render();
    setRing(false);
    renderCards();
}

async function runDemo() {
    const tok = ++demo.token;
    if (demo.i >= DEMO_N || demo.state === "done") demo.i = 0;
    if (demo.i === 0) {
        clearCabin();
        demo.shown = 0;
        paintAll();
    }
    demo.state = "playing";
    paintBar();
    while (busy) {
        await sleep(120);
        if (tok !== demo.token) return;
    }
    while (demo.i < DEMO_N) {
        const k = demo.i++;
        demo.shown = k + 1;
        paintBar();
        await send(demoList()[k]);
        if (tok !== demo.token) return;
        await sleep(k === DEMO_N - 1 ? 600 : 2300);
        if (tok !== demo.token) return;
    }
    demo.state = "done";
    paintBar();
}

function pauseDemo() {
    if (demo.state !== "playing") return;
    demo.token++;
    demo.state = "paused";
    paintBar();
}

$("demoBtn").onclick = () => {
    closePops();
    if (demo.state === "playing") pauseDemo(); else runDemo();
};

$("resetBtn").onclick = () => {
    closePops();
    demo.token++;
    demo.state = "idle";
    demo.i = 0;
    demo.shown = 0;
    clearCabin();
    paintAll();
    const b = $("resetBtn");
    b.classList.remove("spin");
    void b.offsetWidth;
    b.classList.add("spin");
};

/* ── try one sentence by hand: pick it from the list, or type it ── */
async function sendUser(text) {
    text = (text || "").trim();
    if (!text) return;
    pauseDemo();
    closePops();
    $("chatIn").value = "";
    paintTry();
    const g = gen;
    while (busy) {
        await sleep(100);
        if (g !== gen) return;
    }
    send(text);
}

function closePops() {
    $("tryPop").classList.remove("show");
    $("log").classList.remove("show");
    $("tryBtn").classList.remove("on");
    $("logBtn").classList.remove("on");
    $("tryBtn").setAttribute("aria-expanded", "false");
    $("logBtn").setAttribute("aria-expanded", "false");
}

$("tryBtn").onclick = e => {
    e.stopPropagation();
    const open = !$("tryPop").classList.contains("show");
    closePops();
    if (!open) return;
    $("tryPop").classList.add("show");
    $("tryBtn").classList.add("on");
    $("tryBtn").setAttribute("aria-expanded", "true");
    paintTry();
    if (matchMedia("(hover:hover)").matches) $("chatIn").focus();
};

$("logBtn").onclick = e => {
    e.stopPropagation();
    const open = !$("log").classList.contains("show");
    closePops();
    if (!open) return;
    $("log").classList.add("show");
    $("logBtn").classList.add("on");
    $("logBtn").setAttribute("aria-expanded", "true");
    $("logList").scrollTop = $("logList").scrollHeight;
};

$("tryList").onclick = e => {
    const b = e.target.closest("button");
    if (b) sendUser(b.textContent);
};

$("chatIn").oninput = paintTry;

$("chatIn").onkeydown = e => {
    if (e.key === "Enter") sendUser($("chatIn").value);
};

$("sendBtn").onclick = () => sendUser($("chatIn").value);

document.addEventListener("pointerdown", e => {
    if (!e.target.closest("#tryPop,#log,#tryBtn,#logBtn")) closePops();
});

document.addEventListener("keydown", e => {
    if (e.key === "Escape") closePops();
});

window.addEventListener("resize", () => $("pulseLayer").innerHTML = "");

/* small layouts show only the screen and its controls: bigger, easier to read */
const mqSmall = matchMedia("(max-width:840px), (max-height:430px)");

const fitConsole = () => $("panel").setAttribute("viewBox", mqSmall.matches ? "76 90 336 186" : "0 4 480 296");

mqSmall.addEventListener("change", fitConsole);

fitConsole();
const FIT = { "nav-dest": 198, "nav-sub": 198, "tour-dest": 190, "panel-status-title": 150, "panel-status-sub": 150 };
function fitTexts() {
    for (const [id, w] of Object.entries(FIT)) {
        const el = document.getElementById(id); if (!el || !el.textContent) continue;
        let full = el.textContent; if (full.endsWith("…") && el.dataset.full && el.dataset.full.startsWith(full.slice(0, -1))) full = el.dataset.full;
        el.dataset.full = full; el.textContent = full;
        const base = +(el.dataset.fs || (el.dataset.fs = el.getAttribute("font-size")));
        let fs = base; el.setAttribute("font-size", fs);
        let n = 0; while (el.getComputedTextLength() > w && fs > base * .6 && n++ < 30) { fs -= .25; el.setAttribute("font-size", fs); }
        if (el.getComputedTextLength() > w) { let t = full; while (t.length > 3 && el.getComputedTextLength() > w) { t = t.slice(0, -1); el.textContent = t.trimEnd() + "…"; } }
    }
    document.querySelectorAll(".card .big, .card .sub").forEach(e => { e.style.fontSize = ""; let fs = parseFloat(getComputedStyle(e).fontSize), n = 0; while (e.scrollWidth > e.clientWidth + 1 && fs > 9 && n++ < 30) { fs -= 1; e.style.fontSize = fs + "px"; } });
}
const _renderFit = render; render = function () { const r = _renderFit.apply(this, arguments); try { fitTexts(); } catch (e) { } return r; };
render();


applyLang();</script>
