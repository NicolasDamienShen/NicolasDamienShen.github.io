<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabin Voice · DSL Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%2314122a%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2728%27 text-anchor=%27middle%27 fill=%27%23ffc46e%27%3ENS%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#07070f;--fg:#e6e9ef;--muted:#8a93a3;--line:#1a1d2e;--cyan:#3fd2ff;--ind:#6f7fe8;--card:rgba(20,23,51,.72)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  .app{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;height:100vh;background:radial-gradient(ellipse at 35% 55%,#121226 0%,#07070f 70%)}
  .carcell{grid-row:1/3;position:relative;display:flex;align-items:center;justify-content:center;padding:12px 28px 12px 24px}
  .carcell svg#car{height:96vh;width:auto}
  .panelcell{position:relative;display:flex;align-items:flex-start;justify-content:center;padding:14px 24px 0}
  .panelcell svg#panel{width:min(100%,820px);height:auto;max-height:68vh;transition:opacity .35s,transform .35s}
  body.panelHidden .panelcell{padding:0;height:0;overflow:hidden}
  body.panelHidden .panelcell svg#panel{opacity:0;transform:translateY(-10px);pointer-events:none}
  #screen-center{cursor:pointer}
  #screen-center:hover rect:first-child{stroke:#fff}
  .panelHint{position:absolute;left:24px;bottom:14px;font-size:11px;color:#5c6577}
  .cmdcell{display:flex;flex-direction:column;gap:10px;padding:10px 24px 16px;min-height:0}
  .cmdcell .inrow{flex:none}
  .cmdcell .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
  .cmdcell .pane{min-height:0;overflow:auto;background:rgba(11,12,22,.7);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .menu{position:absolute;right:30px;bottom:120px;z-index:12;display:none;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:rgba(15,17,32,.96);border:1px solid #1f2447;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .menu.show{display:flex}
  .menu .row{display:flex;gap:6px;align-items:center}
  .menu label{font-size:11px;color:#8a93a3;width:44px}
  
  .top{display:flex;align-items:center;gap:8px}
  .top .brand{font-weight:600;letter-spacing:.04em;font-size:13px;flex:1}
  .top .brand small{color:var(--muted);font-weight:400;margin-left:8px;font-size:11px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid #1f2447;background:#0f1120;font-size:12px;color:#b9c2d0}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:#ff9a7a}
  .chip.live .dot{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
  .seg{display:inline-flex;border:1px solid #1f2447;border-radius:99px;overflow:hidden}
  .seg button{all:unset;cursor:pointer;padding:4px 12px;font-size:12px;color:#8a93a3}
  .seg button.on{background:#141733;color:var(--cyan)}
  .lat{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#9ff0ff}
  .lat span{color:#5c6577}
  .top .sp{display:none}
  .top input{background:#0f1120;border:1px solid #1f2447;color:#9ff0ff;border-radius:8px;padding:4px 8px;font:12px ui-monospace,Menlo,monospace;width:150px}
  .top button.b{all:unset;cursor:pointer;padding:4px 12px;border-radius:8px;border:1px solid #1f2447;font-size:12px;color:#b9c2d0}
  .top button.b:hover{border-color:var(--cyan);color:var(--cyan)}
  
  .msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
  .msg{max-width:92%;padding:8px 12px;border-radius:14px;font-size:12.5px;line-height:1.45}
  .msg.u{align-self:flex-end;background:#1f2447;color:#e6e9ef;border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start;background:rgba(63,210,255,.10);color:#9ff0ff;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:pre-wrap;border-bottom-left-radius:4px}
  .inrow{display:flex;gap:6px;align-items:center}
  .inrow input{flex:1;min-width:0;background:#0f1120;border:1px solid #1f2447;border-radius:12px;padding:10px 12px;color:#e6e9ef;font-size:13px}
  .inrow input:focus{outline:none;border-color:var(--cyan)}
  .inrow button{all:unset;cursor:pointer;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:600}
  .inrow .send{background:var(--cyan);color:#07070f}
  .inrow .clr{border:1px solid #1f2447;color:#8a93a3}
  h2{font-size:11px;letter-spacing:.1em;color:var(--ind);margin:0 0 4px;text-transform:uppercase}
  .dline{border:1px solid #1f2447;border-radius:10px;background:#0f1120;padding:9px 11px;transition:border-color .3s,box-shadow .3s,background .3s;cursor:pointer}
  .dline.exec{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(63,210,255,.25);background:#111a30}
  .dline .tool{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#9ff0ff}
  .dline .tool b{color:#fff;font-weight:600}
  .dline .tag{float:right;font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid}
  .tag.jev{color:#9ff0ff;border-color:#3fd2ff55}
  .tag.llm{color:#ffd3c4;border-color:#ff9a7a66}
  .dline .probs{display:none;margin-top:8px;border-top:1px solid #1a1d2e;padding-top:6px;font-size:11px}
  .dline.open .probs{display:block}
  .probs .p{display:flex;align-items:center;gap:6px;margin:3px 0}
  .probs .k{width:60px;color:#8a93a3;font-family:ui-monospace,Menlo,monospace}
  .probs .bar{flex:1;height:5px;background:#1a1d2e;border-radius:3px;overflow:hidden}
  .probs .bar i{display:block;height:100%;background:var(--cyan)}
  .probs .bar i.llm{background:#ff9a7a}
  .probs .v{width:84px;color:#c3cad6;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;text-align:right}
  .empty{color:#5c6577;font-size:12px;padding:10px;border:1px dashed #1f2447;border-radius:10px}
  .warn{font-size:11px;color:#ffb59c;border:1px solid #ff9a7a44;border-radius:8px;padding:6px 10px}
  .tools-top{font-size:11px;color:#8a93a3}
  .tools-top b{color:#9ff0ff;font-weight:500}
  
  .stage{position:relative;display:flex;align-items:center;justify-content:center;gap:40px;background:radial-gradient(ellipse at 50% 55%,#121226 0%,#07070f 70%);overflow:hidden;padding:10px 20px}
  .cards{position:absolute;left:24px;right:24px;top:10px;height:50%;z-index:5}
  .side svg#panel{width:100%;height:auto;max-height:56vh}
  .stage .busy{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(15,17,32,.85);border:1px solid #1f2447;color:#9ff0ff;font-size:12px}
  .stage .busy i{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:pulseDot 1s ease-in-out infinite}
  @keyframes pulseDot{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.2);opacity:1}}
  
  .card{position:absolute;left:0;right:0;top:8px;border-radius:16px;padding:16px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(127,233,255,.25);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(-120%);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.25,1.05),opacity .4s}
  .card.show{transform:translateY(0);opacity:1}
  .card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .card .hd .t{font-size:11px;letter-spacing:.1em;color:#9ff0ff}
  .card .hd .x{all:unset;cursor:pointer;color:#8a93a3;font-size:14px;padding:0 4px}
  .card .big{font-size:20px;font-weight:600;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .sub{color:#b9c2d0;font-size:12px}
  .card .row{display:flex;gap:10px;margin-top:10px}
  .card .kv{flex:1;background:rgba(7,7,15,.45);border-radius:10px;padding:8px 10px}
  .card .kv small{display:block;color:#8a93a3;font-size:10px}
  .card .kv span{font-size:13px;color:#e6e9ef}
  .card svg.map{width:100%;height:120px;border-radius:10px;background:#0a0b18;margin-top:10px}
  .card .prog{height:4px;background:#1f2447;border-radius:2px;margin-top:12px;overflow:hidden}
  .card .prog i{display:block;height:100%;width:30%;background:#ff6a8e;transition:width .5s}
  .card .cover{width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,#ff6a8e,#b53aa5);display:flex;align-items:center;justify-content:center;flex:none}
  .card .cover i{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6)}
  .card .cover i.spin{animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .card .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#6ee07a,#2b9a52);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;position:relative;flex:none}
  .card .avatar:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid #6ee07a;opacity:.4;animation:ring 2s ease-out infinite}
  @keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.5);opacity:0}}
  .card .hang{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;background:#ff3b6b;display:flex;align-items:center;justify-content:center;margin-left:auto}
  .card .ep{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(168,85,247,.25);color:#dcbfff;font-size:11px;margin-left:6px}
  .card.tour .kv{min-width:0}
  
  .chat{grid-column:1/3;border-top:1px solid var(--line);background:#0b0c16;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative}
  .bubbles{flex:1;display:flex;gap:8px;overflow:hidden;align-items:center;cursor:pointer}
  .bub{flex:none;max-width:260px;padding:7px 12px;border-radius:14px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bub.u{background:#1f2447;color:#e6e9ef}
  .bub.a{background:rgba(63,210,255,.12);color:#9ff0ff;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
  .chat input{flex:1.4;background:#0f1120;border:1px solid #1f2447;border-radius:12px;padding:10px 14px;color:#e6e9ef;font-size:14px}
  .chat input:focus{outline:none;border-color:var(--cyan)}
  .chat button{all:unset;cursor:pointer;padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600}
  .chat .send{background:var(--cyan);color:#07070f}
  .chat .clr{border:1px solid #1f2447;color:#8a93a3}
  .drawer{position:absolute;left:0;right:0;bottom:92px;max-height:46vh;overflow:auto;background:rgba(11,12,22,.96);border-top:1px solid var(--line);padding:14px 20px;display:none;z-index:30}
  .drawer.show{display:block}
  .drawer .m{margin:6px 0;display:flex;gap:10px}
  .drawer .m .who{width:40px;color:#8a93a3;font-size:11px;padding-top:4px}
  .drawer .m .txt{padding:6px 12px;border-radius:12px;background:#1f2447;max-width:70%}
  .drawer .m.a .txt{background:rgba(63,210,255,.12);color:#9ff0ff;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap}
  
  #pulseLayer{position:fixed;inset:0;pointer-events:none;z-index:20}
  #pulseLayer path{fill:none;stroke:var(--cyan);stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 6px #3fd2ff);stroke-dasharray:8 10;animation:dash 1.1s linear infinite;opacity:.95;transition:opacity .5s}
  @keyframes dash{to{stroke-dashoffset:-36}}
  
  .dbg{position:fixed;right:10px;top:10px;width:380px;max-height:70vh;overflow:auto;background:#0b0c16;border:1px solid #1f2447;border-radius:12px;padding:12px;display:none;z-index:40;font-size:11px}
  .dbg.show{display:block}
  pre{font-size:11px;color:#9ff0ff;background:#07070f;border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-all}
  .tests div{padding:2px 0}.pass{color:#6ee07a}.fail{color:#ff6a8e}
  #rapps .rapp{cursor:pointer;transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s;transform-box:fill-box;transform-origin:center}
  #rapps .rapp:hover{transform:scale(1.08)}
  #rapps .rapp.on rect{stroke:#fff;stroke-width:1.6;filter:url(#pGlow)}
  #rapps .rapp.on{transform:scale(1.12)}
  #panel-apps.hidden #rapps .rapp{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0;pointer-events:none}
  #panel-models.hidden #panel-model-gear{transform:translate(0,37px) scale(.1);opacity:0;transition-delay:0s}
  #panel-models.hidden #panel-model-plug{transform:translate(0,58px) scale(.1)!important;opacity:0}
  #panel-model-gear{transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s;transform-box:fill-box;transform-origin:center}
  #panel-screen > g[opacity="0"], #app-ui-phone > g[opacity="0"]{pointer-events:none}   
  .hl{animation:hl 1.2s ease-out}
  @keyframes hl{0%{filter:drop-shadow(0 0 0 #3fd2ff)}30%{filter:drop-shadow(0 0 8px #3fd2ff)}100%{filter:drop-shadow(0 0 0 #3fd2ff)}}
  #zones rect{transition:fill .8s,opacity .8s}
  #temps{transition:opacity .4s}
  #fog-front{transition:opacity 2.4s ease-out}
  #defog-front,#defog-rear{transition:opacity .6s}
  #mirror-l rect:first-child,#mirror-r rect:first-child{transition:stroke .4s,fill .4s}
  .hl{animation:hl 1.2s ease-out}
  @keyframes hl{0%{filter:drop-shadow(0 0 0 #3fd2ff)}30%{filter:drop-shadow(0 0 8px #3fd2ff)}100%{filter:drop-shadow(0 0 0 #3fd2ff)}}
  .sfx-heat{transition:opacity .6s}
  #spk-waves circle{transform-box:fill-box;transform-origin:center;animation:spk var(--dur,2s) ease-out infinite}
  @keyframes spk{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1);opacity:0}}
  #spk-mute{transition:opacity .3s}
  #light-dash,#light-door-l,#light-door-r,#light-foot rect,#panel-light,#roof-glass{transition:stroke .7s,fill .7s,opacity .7s,fill-opacity .7s}
  .sfx-vent line{stroke:#3fd2ff;stroke-width:1.4;stroke-linecap:round;animation:ventUp var(--dur,1.4s) linear infinite}
  @keyframes ventUp{0%{transform:translateY(14px);opacity:0}25%{opacity:.9}100%{transform:translateY(-22px);opacity:0}}
  .sfx-massage circle{fill:none;stroke:#c084fc;stroke-width:1.4;animation:ripple var(--dur,1.6s) ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ripple{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
  #panel-screen.shake{animation:shake .5s ease-in-out}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  #panel-wave line{transform-box:fill-box;transform-origin:center;animation:wave 1.6s ease-in-out infinite}
  #panel-wave line:nth-child(1){animation-delay:0s}#panel-wave line:nth-child(2){animation-delay:.15s}#panel-wave line:nth-child(3){animation-delay:.3s}#panel-wave line:nth-child(4){animation-delay:.45s}#panel-wave line:nth-child(5){animation-delay:.3s}#panel-wave line:nth-child(6){animation-delay:.15s}#panel-wave line:nth-child(7){animation-delay:0s}
  @keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
  #panel-screen.speaking #panel-wave line{animation:speak .38s ease-in-out infinite}
  @keyframes speak{0%,100%{transform:scaleY(.35)}30%{transform:scaleY(1.25)}60%{transform:scaleY(.7)}}
  #panel-idle text:last-of-type{animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  #sunroof-panel{transition:transform .9s cubic-bezier(.4,0,.2,1)}
  #side-windows rect{transition:y .3s,height .3s}
  #win-sunroof rect{transition:all .9s cubic-bezier(.4,0,.2,1)}
  #sunroof-lip{transition:opacity .25s}
  .knob{cursor:grab}.knob:active{cursor:grabbing}
  .mbtn{cursor:pointer}.mbtn:hover path,.mbtn:hover circle{filter:url(#pGlow)}
  #side-windows rect{cursor:ns-resize}
  #win-sunroof{cursor:pointer}
  #win-sunroof rect{transition:none}
  #panel-apps g[id^="panel-app-"]{cursor:pointer;transition:transform .25s cubic-bezier(.4,0,.2,1);transform-box:fill-box;transform-origin:center}
  #panel-apps g[id^="panel-app-"]:hover{transform:scale(1.08)}
  #panel-apps g[id^="panel-app-"].on rect{stroke:#fff;stroke-width:1.6;filter:url(#pGlow)}
  #panel-apps g[id^="panel-app-"].on{transform:scale(1.12)}
  #panel-apps g[id^="panel-app-"]{transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s}
  #panel-apps.hidden #panel-app-nav{transform:translate(0,178px) scale(.1);opacity:0;transition-delay:.12s}
  #panel-apps.hidden #panel-app-music{transform:translate(0,142px) scale(.1);opacity:0;transition-delay:.06s}
  #panel-apps.hidden #panel-app-phone{transform:translate(0,106px) scale(.1);opacity:0;transition-delay:0s}
  #panel-apps:not(.hidden) #panel-app-phone{transition-delay:.12s}
  #panel-apps:not(.hidden) #panel-app-music{transition-delay:.06s}
  #panel-apps.hidden text{opacity:0}
  #panel-apps text{transition:opacity .3s}
  #panel-idle,#panel-status,#app-ui-nav,#app-ui-music,#app-ui-phone{transition:opacity .35s}
  #music-ring{transform-box:fill-box;transform-origin:center;transform:scale(.18)}
  #panel-models g[id^="panel-model-"]{cursor:pointer;transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s;transform-box:fill-box;transform-origin:center}
  #panel-models g[id^="panel-model-"]:hover{transform:scale(1.08)}
  #panel-models g[data-model].on rect{stroke:#fff;stroke-width:1.6;filter:url(#pGlow)}
  #panel-models g[data-model].on{transform:scale(1.12)}
  #panel-models.hidden #panel-model-A{transform:translate(0,117px) scale(.1);opacity:0;transition-delay:.12s}
  #panel-models.hidden #panel-model-B{transform:translate(0,77px) scale(.1);opacity:0;transition-delay:.06s}
  #panel-models.hidden #panel-model-plug{transform:translate(0,98px) scale(.1);opacity:0;transition-delay:0s}
  #panel-models:not(.hidden) #panel-model-plug{transition-delay:.12s}
  #panel-models:not(.hidden) #panel-model-B{transition-delay:.06s}
  #panel-models.hidden > text{opacity:0}
  #panel-models > text{transition:opacity .3s}
  #panel-model-plug{cursor:default}
  #models-toggle-icon{transition:transform .35s;transform-box:fill-box;transform-origin:center}
  #models-toggle.open #models-toggle-icon{transform:rotate(45deg)}
  #apps-toggle-icon{transition:transform .35s;transform-box:fill-box;transform-origin:center}
  #apps-toggle.open #apps-toggle-icon{transform:rotate(45deg)}


  .inrow input:disabled{opacity:.55;cursor:not-allowed}
  .inrow button:disabled{opacity:.35;cursor:not-allowed}
  .top button.b#demoBtn{color:#07070f;background:var(--cyan);border-color:var(--cyan);font-weight:600}
</style>
</head>
<body>
<div class="app">

  <div class="carcell">
    <div class="panelHint" data-i18n="panelHint">Click the in-car screen: show / hide the enlarged console view</div>
    
<svg id="car" viewBox="0 0 400 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC',sans-serif">
<defs>
  <linearGradient id="paint" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#101225"/><stop offset=".5" stop-color="#1d2244"/><stop offset="1" stop-color="#101225"/>
  </linearGradient>
  <linearGradient id="paintV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7cc9ff" stop-opacity=".22"/><stop offset="1" stop-color="#3a5aa0" stop-opacity=".16"/>
  </linearGradient>
  <linearGradient id="roofGlass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5a8fd0" stop-opacity=".10"/><stop offset="1" stop-color="#2a3d70" stop-opacity=".10"/>

function colorToHex(name) {
    if (!name) return null;
    let n = name.replace(/ colou?r$/, "").replace(/^(bright |pale |dark |light |neon )/, m => m);
    if (COLORS[n]) return COLORS[n];
    const n2 = n.replace(/^(bright |pale |light |dark |neon )/, "");
    if (COLORS[n2]) return COLORS[n2];
    for (const k in COLORS) if (n.endsWith(k)) return COLORS[k];
    return null;
}

function parseDSL(text) {
    return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
        const m = line.match(/^(\w+)\s*:\s*(.*)$/);
        if (!m) return {
            tool: null,
            raw: line,
            params: {}
        };
        const params = {};
        m[2].split(/\s+/).filter(Boolean).forEach(kv => {
            const i = kv.indexOf("|");
            if (i > 0) {
                const v = kv.slice(i + 1);
                if (v !== "") params[kv.slice(0, i)] = v.replace(/_/g, " ");
            } else params[kv] = "";
        });
        return {
            tool: m[1],
            raw: line,
            params: params
        };
    });
}

function num(v, [lo, hi], cur) {
    if (v == null) return null;
    if (v === "min") return lo;
    if (v === "max") return hi;
    if (v === "half") return Math.floor((lo + hi) / 2);
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
}

const clamp = (n, [lo, hi]) => Math.max(lo, Math.min(hi, n));

function applyDSL(prev, text) {
    const s = JSON.parse(JSON.stringify(prev));
    const effects = [], warnings = [];
    for (const call of parseDSL(text)) {
        if (!call.tool) {
            warnings.push(`Cannot parse: ${call.raw}`);
            continue;
        }
        const h = HANDLERS[call.tool];
        if (!h) {
            warnings.push(`Tool not implemented ${call.tool} (not in this demo)`);
            continue;
        }
        h(s, call.params, effects, warnings, call.raw);
    }
    return {
        state: s,
        effects: effects,
        warnings: warnings
    };
}

            }

                const q = A.zone[k];
                return q.on ? `${q.temp}℃ fan ${q.fan}${q.mode ? " " + q.mode : ""}` : "Closed";

            if (p.circ) what = `Circulation: ${Z[0].circ || "unset"}`; else if (p.target === "fan speed") what = zones.map(k => `${NAME[k]} ${A.zone[k].on ? "Fan " + A.zone[k].fan : "Closed"}`).join(" · "); else if (p.target === "temperature") what = zones.map(k => `${NAME[k]} ${A.zone[k].on ? A.zone[k].temp + "℃" : "Closed"}`).join(" · "); else if (z && zones.length === 1) what = one(zones[0]); else what = zones.map(k => `${NAME[k]} ${one(k)}`).join(" · ");
            fx.push({
                kind: "status",

                on: false,
                fan: 0,

                kind: "ac",
                zones: zones
            });
            return;
        }
        if (act === "on") {
            Z.forEach(q => {
                q.on = true;
                if (q.fan === 0) q.fan = 3;
            });
        }
        if (p.mode) {
            Z.forEach(q => {
                q.mode = p.mode;
                q.on = true;
                if (q.fan === 0) q.fan = 3;
            });

        if (target && p.degree == null && (act === "increase" || act === "decrease")) p.degree = "1";

function tempColor(t) {
    const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
    const cold = [ 63, 210, 255 ], mid = [ 111, 127, 232 ], warm = [ 255, 106, 61 ];
    const c = t <= 24 ? mix(cold, mid, (t - 16) / 8) : mix(mid, warm, (t - 24) / 8);
    return `rgb(${c.join(",")})`;
}

const MODE_COLOR = {
    "cool": "#3fd2ff",
    "heat": "#ff6a3d",
    "dehumidify": "#2fd1a8",
    "auto": "#7fe9ff",
    "fan": "#dfe9ff",
    "defog": "#dfe9ff",

const SH = {
    f: 0,
    r: 0,
    tf: 0,
    tr: 0,
    t0: 0,
    f0: 0,
    r0: 0,
    raf: 0
};

function drawShade(hF, hR) {
    const f = $("shade-front");
    f.querySelectorAll("rect").forEach(q => q.setAttribute("height", hF));
    const fl = f.querySelector("line");
    fl.setAttribute("y1", 259 + hF);
    fl.setAttribute("y2", 259 + hF);
    fl.setAttribute("opacity", hF > .5 ? 1 : 0);
    const r = $("shade-rear");
    r.querySelectorAll("rect").forEach(q => {
        q.setAttribute("y", 613 - hR);
        q.setAttribute("height", hR);
    });
    const rl = r.querySelector("line");
    rl.setAttribute("y1", 613 - hR);
    rl.setAttribute("y2", 613 - hR);
    rl.setAttribute("opacity", hR > .5 ? 1 : 0);
}

function shadeTo(tf, tr) {
    if (tf === SH.tf && tr === SH.tr) return;
    SH.tf = tf;
    SH.tr = tr;
    SH.f0 = SH.f;
    SH.r0 = SH.r;
    SH.t0 = performance.now();
    cancelAnimationFrame(SH.raf);
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const step = now => {
        const k = Math.min(1, (now - SH.t0) / 900), e = ease(k);
        SH.f = SH.f0 + (SH.tf - SH.f0) * e;
        SH.r = SH.r0 + (SH.tr - SH.r0) * e;
        drawShade(SH.f, SH.r);
        if (k < 1) SH.raf = requestAnimationFrame(step);
    };
    SH.raf = requestAnimationFrame(step);
}

(function loop() {
    let html = "";
    for (const v of VENTS) {
        const want = v.level * 3, speed = .004 + v.level * .0016;
        while (v.ps.length < want) v.ps.push({
            t: Math.random(),
            x: (Math.random() - .5) * 18

        while (v.ps.length > want) v.ps.pop();
        for (const p of v.ps) {
            p.t += speed;
            if (p.t > 1) {
                p.t = 0;
                p.x = (Math.random() - .5) * 18;
            }
            const y = v.y + v.len * p.t, x = v.x + p.x + v.dx * v.len * p.t;
            html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.6 * (1 - p.t * .6)).toFixed(2)}" fill="${v.color}" opacity="${(.9 * (1 - p.t)).toFixed(2)}"/>`;

    $("ac-flows").innerHTML = html;
    requestAnimationFrame(loop);

function playEffects(fx) {
    for (const e of fx) {
        if (e.kind === "defog") {
            const id = e.side === "front" ? "glass-front" : "glass-rear";
            flash(id);
        }
        if (e.kind === "temp") {
            e.zones.forEach(z => flash("temp-" + z));
        }
        if (e.kind === "mirror") {
            flash("mirror-l");
            flash("mirror-r");
        }
        if (e.kind === "win") {
            e.zones.forEach(z => flash("win-" + z));
        }
        if (e.kind === "seat") {
            e.zones.forEach(z => flash("seat-" + z));
        }
        if (e.kind === "volume") {
            if (e.target !== "media") showStatus(`${e.target}volume`, state.muted.media ? "mute" : `${state.vol[e.target]} / 40`, "#3fd2ff"), 
            setTimeout(() => showScreen("panel-idle"), 2500);
        }
        if (e.kind === "light") {
            [ "light-dash", "light-door-l", "light-door-r", "light-foot", "panel-light" ].forEach(flash);
        }
        if (e.kind === "shade") {
            e.zones.forEach(z => flash("shade-" + z));
        }
        if (e.kind === "ac") {
            const v = [];
            if (e.zones.includes("lf")) v.push("ac-front-l", "ac-front-c");
            if (e.zones.includes("rf")) v.push("ac-front-r", "ac-front-c");
            if (e.zones.includes("rear")) v.push("ac-rear");
            [ ...new Set(v) ].forEach(flash);
        }
        if (e.kind === "status") {
            showStatus(e.title, e.sub, e.color || "#3fd2ff", e.icon || "i");
            if (e.shake) {
                const sc = $("panel-screen");
                sc.classList.remove("shake");
                void sc.getBBox();
                sc.classList.add("shake");
            }
            clearTimeout(statusTimer);
            statusTimer = setTimeout(() => {
                if (state.screen === "status") state.screen = prevScreen;
                render();
            }, 3e3);
        }
        if (e.kind === "swipe") {
            swipeVol(e.dir);
        }
        if (e.kind === "music" || e.kind === "nav" || e.kind === "phone" || e.kind === "screen") {}
    }
}

function flash(id) {
    const el = $(id);
    if (!el) return;
    el.classList.remove("hl");

function svgPt(svg, ev) {
    const root = svg.ownerSVGElement || svg;
    const pt = root.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function ringScale() {
    const m = getComputedStyle($("music-ring")).transform;
    return m && m !== "none" ? parseFloat(m.slice(7)) : .18;

function setRing(playing) {
    const ring = $("music-ring"), s0 = ringScale();
    ring.getAnimations().forEach(a => a.cancel());
    if (playing) {
        const a = ring.animate([ {
            transform: `scale(${s0})`
        }, {
            transform: "scale(1)"
        } ], {
            duration: 450,
            easing: "cubic-bezier(.4,0,.2,1)",
            fill: "forwards"
        });
        a.onfinish = () => {
            a.cancel();
            ring.animate([ {
                transform: "scale(1)"
            }, {
                transform: "scale(1.18)"
            }, {
                transform: "scale(1)"
            } ], {
                duration: 1600,
                iterations: Infinity,
                easing: "ease-in-out"
            });
        };
    } else ring.animate([ {
        transform: `scale(${s0})`
    }, {
        transform: "scale(.18)"
    } ], {
        duration: 450,
        easing: "cubic-bezier(.4,0,.2,1)",
        fill: "forwards"
    });
}

let volAnim = false;

function swipeVol(dir) {
    if (volAnim) return;
    volAnim = true;
    const bar = $("media-volbar"), W = 130, w0 = W * (state.muted.media ? 0 : state.vol.media) / 40, T1 = 260, T2 = 320, ease = t => 1 - Math.pow(1 - t, 3), t0 = performance.now();
    const step = now => {
        const t = now - t0;
        let w;
        if (t < T1) w = dir > 0 ? w0 + (W - w0) * ease(t / T1) : w0 * (1 - ease(t / T1)); else if (t < T1 + T2) w = dir > 0 ? w0 * ease((t - T1) / T2) : W - (W - w0) * ease((t - T1) / T2); else {
            bar.setAttribute("width", w0);
            volAnim = false;
            return;
        }
        bar.setAttribute("width", Math.max(0, w));
        requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}

async function infer(hist) {
    const q = turns[turns.length - 1].text;
    await new Promise(r => setTimeout(r, 450));
    return {
        dsl: SCRIPT[q] || "reject: action|unsupported",
        scripted: true
    };
}

async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    busy = true;
    $("chatIn").value = "";
    history.push(text);
    renderChat();
    let res;
    try {
        res = await infer(history);
    } catch (e) {
        res = {
            dsl: "",
            error: T("noServer") + " (" + String(e.message || e) + ")",
            timing_ms: {
                total: 0
            }
        };
        history.pop();
        turns.pop();
        renderChat();
    }
    lastResult = res;
    renderDSL(res);
    if (res.error) addWarn(res.error);
    if (res.note) addWarn(String(res.note).replace(/ \(.*$/, ""));
    const lines = (res.dsl || "").split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length) chatAssistant(lines.join("\n"));
    await playLines(lines);
    busy = false;
}

function addWarn(t) {
    const d = document.createElement("div");
    d.className = "warn";
    d.textContent = "⚠ " + t;
    $("warnBox").appendChild(d);
}

async function playLines(lines) {
    for (let i = 0; i < lines.length; i++) {
        const el = document.querySelectorAll("#dslList .dline")[i];
        document.querySelectorAll("#dslList .dline").forEach(x => x.classList.remove("exec"));
        if (el) el.classList.add("exec");
        const r = applyDSL(state, lines[i]);
        const wasPlaying = state.music.playing;
        state = r.state;
        render();
        playEffects(r.effects);
        r.warnings.forEach(addWarn);
        if (state.music.playing !== wasPlaying) setRing(state.music.playing);
        const sc = $("panel-screen");
        sc.classList.add("speaking");
        clearTimeout(sc._t);
        sc._t = setTimeout(() => sc.classList.remove("speaking"), 1200);
        renderCards();
        if (el) pulseTo(el, targetsFor(lines[i]));
        await new Promise(r => setTimeout(r, lines.length > 1 ? 1600 : 300));
    }
    setTimeout(() => document.querySelectorAll("#dslList .dline").forEach(x => x.classList.remove("exec")), 1400);
}

function targetsFor(line) {
    const c = parseDSL(line)[0];
    if (!c || !c.tool) return [];
    const p = c.params, t = c.tool;
    if (t === "ac") {
        const z = p.zone;
        if (z === "windshield" || z === "all glass") return [ "glass-front" ];
        if (z === "rear glass" || z === "rear window") return [ "glass-rear" ];
        if (z === "mirrors") return [ "mirror-l", "mirror-r" ];
        const zs = ZONE_TEMP[z] || ZONE_TEMP["whole car"];
        const m = {
            lf: "ac-front-l",
            rf: "ac-front-r",
            rear: "ac-rear"
        };
        return zs.map(k => m[k]);
    }
    if (t === "win") {
        const zs = ZONE_WIN[p.zone] || ZONE_WIN["all"];
        return zs.map(k => k === "sunroof" ? "win-sunroof" : "win-" + k);
    }
    if (t === "shade") {
        return (ZONE_SHADE[p.zone] || ZONE_SHADE["all"]).map(k => "shade-" + k);
    }
    if (t === "seat") {
        return (ZONE_SEAT[p.zone] || ZONE_SEAT["all"]).map(k => "seat-" + k);
    }
    if (t === "light") return [ "light-dash" ];
    if (t === "volume") return [ "spk-fl", "spk-fr" ];
    return [ "panel-screen" ];
}

function pulseTo(fromEl, ids) {
    const layer = $("pulseLayer");
    layer.innerHTML = "";
    const a = fromEl.getBoundingClientRect();
    const x0 = a.right, y0 = a.top + a.height / 2;
    ids.forEach(id => {
        const el = $(id);
        if (!el) return;
        const b = el.getBoundingClientRect();
        const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
        const dx = Math.max(60, (x1 - x0) * .45);
        const d = `M${x0} ${y0} C ${x0 + dx} ${y0}, ${x1 - dx} ${y1}, ${x1} ${y1}`;
        const pth = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pth.setAttribute("d", d);
        layer.appendChild(pth);
        flash(id);
    });
    clearTimeout(layer._t);
    layer._t = setTimeout(() => {
        layer.querySelectorAll("path").forEach(p => p.style.opacity = 0);
        setTimeout(() => layer.innerHTML = "", 500);
    }, 1500);
}

function renderDSL(res) {
    const box = $("dslList");
    $("warnBox").innerHTML = "";
    $("toolsTop").innerHTML = "";
    if (!res) {
        box.innerHTML = `<div class="empty">${T("dslEmpty")}</div>`;
        $("lat").textContent = "— ms";
        return;
    }
    const tm = res.timing_ms || {};
    $("lat").innerHTML = res.scripted ? T("scripted") : `${Math.round(tm.total || 0)} ms`;
    if (res.jev && res.jev.tools_top) $("toolsTop").innerHTML = (lang === "zh" ? "routing: " : "routing: ") + res.jev.tools_top.slice(0, 3).map(([t, p]) => `<b>${t}</b> ${(p * 100).toFixed(0)}%`).join(" · ");
    const lines = (res.dsl || "").split("\n").map(l => l.trim()).filter(Boolean);
    box.innerHTML = lines.map(line => {
        const c = parseDSL(line)[0];
        const jp = res.jev && res.jev.params && res.jev.params[c.tool];
        const usedLLM = jp ? Object.values(jp).some(v => v.by === "llm") : res.jev ? false : null;
        const tag = usedLLM == null ? "" : `<span class="tag ${usedLLM ? "llm" : "jev"}">${usedLLM ? T("llm") : T("jev")}</span>`;
        const probs = jp ? Object.entries(jp).map(([k, v]) => {
            const [bv, bp] = v.top[0];
            const rest = v.top.slice(1).map(([a, b]) => `${a} ${(b * 100).toFixed(0)}%`).join(" · ");
            return `<div class="p"><span class="k">${k}</span><div class="bar"><i class="${v.by === "llm" ? "llm" : ""}" style="width:${(bp * 100).toFixed(0)}%"></i></div><span class="v">${bv} ${(bp * 100).toFixed(0)}%</span></div>${rest ? `<div style="color:#5c6577;font-size:10px;margin:-2px 0 2px 66px">${rest}</div>` : ""}`;
        }).join("") : "";
        const params = Object.entries(c.params).map(([k, v]) => `${k}|<b>${v}</b>`).join(" ");
        return `<div class="dline" onclick="this.classList.toggle('open')">${tag}<div class="tool"><b>${c.tool}</b>: ${params}</div>${probs ? `<div class="probs">${probs}${res.jev && res.jev.llm_raw ? `<div style="color:#ffd3c4;margin-top:4px">LLM → ${res.jev.llm_raw}</div>` : ""}</div>` : ""}</div>`;
    }).join("") || `<div class="empty">—</div>`;
}

const dur = s => {
    let h = 0;
    for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 997;
    return 180 + h % 120;
};

function buildQueue(p) {
    const mk = (song, singer, album) => ({
        song: song,
        singer: singer,
        album: album || ""
    });
    if (p.list) return {
        title: p.list,
        items: DEFAULT_Q.map(x => mk(...x))
    };
    if (p.album) {
        const sg = p.singer || Object.keys(CATALOG).find(k => CATALOG[k].some(x => x[1] === p.album));
        const items = sg ? CATALOG[sg].filter(x => x[1] === p.album).map(x => mk(x[0], sg, x[1])) : [];
        return {
            title: `Album · ${p.album}`,
            items: items.length ? items : [ mk(p.album, sg || "", p.album) ]
        };
    }
    if (p.name) {
        return {
            title: p.name,
            items: [ mk(`${p.name}${p.type ? " " + p.type : ""}`, "Soundtrack", p.name) ]
        };
    }
    if (p.singer) {
        const arr = CATALOG[p.singer] || [ [ "Songs by " + p.singer, "" ] ];
        let items = arr.map(x => mk(x[0], p.singer, x[1]));
        if (p.song) {
            const i = items.findIndex(x => x.song === p.song);
            if (i > 0) {
                const [it] = items.splice(i, 1);
                items.unshift(it);
            } else if (i < 0) items.unshift(mk(p.song, p.singer, ""));
        }
        return {
            title: `${p.singer}`,
            items: items
        };
    }
    if (p.song) {
        const sg = SONG2SINGER[p.song];
        const rest = sg ? CATALOG[sg].filter(x => x[0] !== p.song).map(x => mk(x[0], sg, x[1])) : DEFAULT_Q.map(x => mk(...x));
        return {
            title: p.song,
            items: [ mk(p.song, sg || "", sg ? (CATALOG[sg].find(x => x[0] === p.song) || [])[1] : ""), ...rest ]
        };
    }
    return {
        title: p.mode || "recommend",
        items: DEFAULT_Q.map(x => mk(...x))
    };
}

function setTrack(m, i) {
    m.pos = 0;
    const q = m.queue;
    if (!q || !q.items.length) return;
    const n = q.items.length;
    if (m.mode === "shuffle" && i !== m.idx) {
        i = Math.floor(Math.random() * n);
    }
    m.idx = (i % n + n) % n;
    const t = q.items[m.idx];
    m.song = t.song;
    m.singer = t.singer;
    m.album = t.album;
    m.track = m.idx + 1;
    m.dur = dur(t.song + t.singer);
    m.pos = 0;
    m.fav = false;
}

function touch(s, kind, name) {
    const id = kind === "app" ? "app:" + name : kind;
    const rest = s.recent.filter(r => r.id !== id);
    s.recent = [ {
        id: id,
        kind: kind,
        name: name || APP_NAMES[kind] || kind
    }, ...rest ];
    while (s.recent.length > 9) {
        const i = s.recent.map(r => r.kind).lastIndexOf("app");
        if (i < 0) break;
        s.recent.splice(i, 1);
    }
}

function genMap(seed) {
    let t = seed >>> 0 || 1;
    const R = () => {
        t ^= t << 13;
        t >>>= 0;
        t ^= t >> 17;
        t ^= t << 5;
        t >>>= 0;
        return t / 4294967296;
    };
    const rnd = (a, b) => a + (b - a) * R();
    const n = 5, pts = [];
    for (let i = 0; i < n; i++) {
        const x = 76 + i * (196 / (n - 1)) + (i > 0 && i < n - 1 ? rnd(-14, 14) : 0);
        const y = i === n - 1 ? rnd(128, 160) : x > 160 ? rnd(124, 172) : rnd(124, 208);
        pts.push([ Math.round(x), Math.round(y) ]);
    }
    if (R() < .5) pts.reverse().forEach(p => p[0] = 360 - p[0]);
    pts.forEach(p => {
        if (p[0] > 160) p[1] = Math.min(p[1], 170);
    });
    pts[n - 1][1] = Math.min(pts[n - 1][1], 168);
    const c = (a, b) => {
        const dx = (b[0] - a[0]) / 2;
        return `C ${a[0] + dx} ${a[1]} ${b[0] - dx} ${b[1]} ${b[0]} ${b[1]}`;
    };
    const seg = [];
    for (let i = 0; i < n - 1; i++) seg.push(`M${pts[i][0]} ${pts[i][1]} ${c(pts[i], pts[i + 1])}`);
    const route = `M${pts[0][0]} ${pts[0][1]} ` + pts.slice(1).map((q, i) => c(pts[i], q)).join(" ");
    const G = "#2fd1a8";
    let deco = `<g stroke="${G}" stroke-width=".6" opacity=".16"><path d="`;
    for (let y = 120 + rnd(0, 20); y < 222; y += rnd(26, 42)) deco += `M60 ${y.toFixed(0)} H300 `;
    for (let x = 80 + rnd(0, 30); x < 300; x += rnd(40, 64)) deco += `M${x.toFixed(0)} 112 V224 `;
    deco += '"/></g>';
    if (R() < .5) {
        const y0 = rnd(118, 140);
        deco += `<path d="M60 ${y0.toFixed(0)} C 120 ${(y0 + rnd(-10, 10)).toFixed(0)} 200 ${(y0 + rnd(-12, 12)).toFixed(0)} 300 ${(y0 + rnd(-8, 8)).toFixed(0)}" fill="none" stroke="#3f8cff" stroke-width="${rnd(7, 11).toFixed(0)}" opacity=".18"/><text x="${rnd(90, 220).toFixed(0)}" y="${(y0 + 14).toFixed(0)}" fill="#3f8cff" font-size="6" opacity=".6">${[ "Shenzhen River", "Dong River", "Xili Lake", "Dasha River" ][Math.floor(R() * 4)]}</text>`;
    }
    const NAMES = [ "Park", "School", "Hospital", "Mall", "Stadium", "Tech Park", "Metro", "Library" ];
    for (let k = 0, m = 1 + Math.floor(R() * 3); k < m; k++) {
        const x = rnd(70, 250), y = rnd(150, 200), w = rnd(30, 56), h = rnd(16, 30);
        deco += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="3" fill="${G}" opacity=".08"/><text x="${(x + 5).toFixed(0)}" y="${(y + 11).toFixed(0)}" fill="${G}" font-size="6" opacity=".5">${NAMES.splice(Math.floor(R() * NAMES.length), 1)[0]}</text>`;
    }
    return {
        route: route,
        seg: seg,
        me: pts[0],
        pin: pts[n - 1],
        deco: deco
    };
}

function mapHTML(k, traffic, located) {
    const M = genMap(k), TC = [ "#3ddc84", "#ff8c42", "#ff3b6b", "#3ddc84" ];
    return `${M.deco}<path d="${M.route}" fill="none" stroke="#2fd1a8" stroke-width="3" stroke-linecap="round" opacity=".9" filter="url(#pGlow)"/>\n    <g id="nav-traffic" opacity="${traffic ? 1 : 0}" stroke-width="3.5" stroke-linecap="round" fill="none">${M.seg.map((d, i) => `<path d="${d}" stroke="${TC[i]}"/>`).join("")}</g>\n    <g id="nav-me" opacity="${located ? 1 : 0}"><circle cx="${M.me[0]}" cy="${M.me[1]}" r="9" fill="none" stroke="#2fd1a8" stroke-width="1"><animate attributeName="r" values="6;14;6" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="1.8s" repeatCount="indefinite"/></circle></g>\n    <circle cx="${M.me[0]}" cy="${M.me[1]}" r="4" fill="#dfe9ff"/><circle r="3" fill="#2fd1a8" filter="url(#pGlow)"><animateMotion dur="4s" repeatCount="indefinite" path="${M.route}"/></circle>\n    <path d="M${M.pin[0]} ${M.pin[1]} C ${M.pin[0] - 4} ${M.pin[1]} ${M.pin[0] - 6} ${M.pin[1] - 3} ${M.pin[0] - 6} ${M.pin[1] - 6} C ${M.pin[0] - 6} ${M.pin[1] - 10} ${M.pin[0]} ${M.pin[1] - 16} ${M.pin[0]} ${M.pin[1] - 16} C ${M.pin[0]} ${M.pin[1] - 16} ${M.pin[0] + 6} ${M.pin[1] - 10} ${M.pin[0] + 6} ${M.pin[1] - 6} C ${M.pin[0] + 6} ${M.pin[1] - 3} ${M.pin[0] + 4} ${M.pin[1]} ${M.pin[0]} ${M.pin[1]} Z" fill="#2fd1a8"/>`;
}

HANDLERS.nav = function(s, p, fx, warn) {
    norm(p, {
        "open": "on",
        "close": "off"
    });
    const n = s.nav, a = p.action || (p.end ? "navigate" : p.search ? "search" : "locate");
    const reroll = () => {
        n.map = 1 + Math.floor(Math.random() * 4294967294);
    };
    if (p.target === "traffic" && (a === "on" || a === "off" || a === "traffic")) {
        n.traffic = a !== "off";
        n.active = n.active || n.traffic;
        if (p.end && p.end !== n.dest) {
            reroll();
        }
        if (p.end) n.dest = p.end;
        s.screen = "nav";
        fx.push({
            kind: "nav"
        });
        return;
    }
    if (a === "traffic") {
        n.traffic = !n.traffic;
        n.active = true;
        if (p.end && p.end !== n.dest) {
            reroll();
        }
        if (p.end) n.dest = p.end;
        s.screen = "nav";
        touch(s, "nav");
        fx.push({
            kind: "nav"
        });
        return;
    }
    if (a === "locate") {
        n.located = true;
        n.active = true;
        s.screen = "nav";
        fx.push({
            kind: "status",
            title: "Current location",
            sub: p.target === "traffic" ? "Traffic nearby: clear · demo" : "Shennan Blvd · demo",
            icon: "◎",
            color: "#2fd1a8"
        });
        return;
    }
    if (a === "time left" || a === "distance left") {
        if (p.end && p.end !== n.dest) {
            reroll();
        }
        if (p.end) n.dest = p.end;
        n.active = true;
        n.remaining = a === "time left" ? "left 24 min" : "left 18 km";
        s.screen = "nav";
        fx.push({
            kind: "status",
            title: n.remaining,
            sub: `to ${n.dest || "Destination"}${p.target === "traffic" ? " · road ahead clear" : ""} · demo`,
            icon: "➤",
            color: "#2fd1a8"
        });
        return;
    }
    if (a === "search" && p.end && !p.search) {
        s.list = mkList("guide", `${p.end} guide`, Array.from({
            length: 8
        }, (_, i) => ({
            name: `${p.end}guide ${i + 1}`,
            meta: [ "3 days", "5 days", "weekend", "7 days" ][i % 4]
        })));
        n.search = p.end;
        s.screen = "list";
        touch(s, "nav");
        fx.push({
            kind: "list"
        });
        return;
    }
    if (a === "search" && !p.end) {
        const dist = p.distance ? `${p.distance} ${p.unit || "km"}` : "nearby";
        const what = p.search || "places";
        s.list = mkList("places", `${what} · ${dist}`, Array.from({
            length: 8
        }, (_, i) => ({
            name: `${what} ${i + 1}`,
            meta: `${(.4 + i * .7).toFixed(1)} km`
        })));
        n.search = what;
        if (p.route) n.route = p.route;
        s.screen = "list";
        touch(s, "nav");
        fx.push({
            kind: "list"
        });
        return;
    }
    if (a === "navigate" || a === "on" || a === "search") {
        const nd = p.end || (p.search ? p.search + " nearby" : n.dest || "Destination");
        if (nd !== n.dest || !n.active || p.start && p.start !== n.start || p.route && p.route !== n.route) reroll();
        n.active = true;
        n.dest = nd;
        if (p.start) n.start = p.start;
        if (p.route) n.route = p.route;
        n.remaining = "";
        s.screen = "nav";
        touch(s, "nav");
        fx.push({
            kind: "nav"
        });
        return;
    }
    if (a === "off") {
        n.active = false;
        n.traffic = false;
        if (s.screen === "nav") s.screen = "idle";
        fx.push({
            kind: "screen"
        });
        return;
    }
    warn.push(`nav: unknown action ${a}`);
};

const toSec = p => (Number(p.hour) || 0) * 3600 + (Number(p.minute) || 0) * 60 + (Number(p.second) || 0);

HANDLERS.video = function(s, p, fx, warn) {
    const a = p.action || "play";
    const v = s.video || (s.video = {
        name: "",
        ep: "",
        type: "",
        actor: "",
        source: "iQIYI",
        playing: false,
        pos: 0,
        dur: 5400
    });
    if (p.name) v.name = p.name;
    if (p.type) v.type = p.type;
    if (p.actor) v.actor = p.actor;
    if (p.source) v.source = p.source;
    if (a === "query") {
        const who = p.actor || p.name || "Trending";
        s.list = mkList("shows", `${who} · ${p.type || "shows"}`, Array.from({
            length: 6
        }, (_, i) => ({
            name: `${who}works ${i + 1}`,
            meta: p.type || ""
        })));
        s.screen = "list";
        fx.push({
            kind: "list"
        });
        return;
    }
    if (a === "play") {
        if (p.ep) v.ep = p.ep;
        if (!v.name) v.name = v.actor ? `${v.type || "film"} · ${v.actor}` : v.type || "video";
        v.playing = true;
        if (p.ep || p.name) v.pos = 0;
        {
            const d = toSec(p);
            if (d) v.pos = Math.min(v.dur, d);
        }
        s.screen = "video";
        touch(s, "video");
    } else if (a === "pause") {
        v.playing = false;
        s.screen = "video";
    } else if (a === "next episode" || a === "previous episode") {
        v.ep = String(Math.max(1, (Number(v.ep) || 1) + (a === "next episode" ? 1 : -1)));
        v.pos = 0;
        v.playing = true;
        s.screen = "video";
    } else if (a === "fast-forward" || a === "rewind") {
        let d = toSec(p);
        if (p.ep && !d) {
            v.ep = p.ep;
            v.pos = 0;
        } else {
            if (!d) d = 30;
            v.pos = Math.max(0, Math.min(v.dur, v.pos + (a === "fast-forward" ? d : -d)));
        }
        s.screen = "video";
    } else if (a === "settings") {
        if (p.ep) v.ep = p.ep;
        const d = toSec(p);
        if (d) v.pos = Math.min(v.dur, d);
        s.screen = "video";
    } else warn.push(`video: unknown action ${a}`);
    fx.push({
        kind: "video"
    });
};

        kind: "volume",
        target: t

};

HANDLERS.general = function(s, p, fx, warn) {
    let a = p.action, idx = parseInt(p.index) || 0;
    const sc = s.screen;
    if (a === "close" || a === "off") a = "exit";
    if (a === "open" || a === "on" || a === "view") {
        s.list = listFor(s, p.object);
        s.screen = "list";
        fx.push({
            kind: "list"
        });
        return;
    }
    const close = () => {
        if (sc === "app") s.app = null;
        if (sc === "nav") s.nav.active = false;
        if (sc === "phone") s.phone.active = false;
        if (sc === "video" && s.video) s.video.playing = false;
        s.screen = "idle";
        fx.push({
            kind: "screen"
        });
    };
    if ([ "cancel", "back", "exit", "home" ].includes(a)) {
        if (sc !== "idle") {
            if (a === "exit" || a === "home") {
                s.list = null;
            }
            close();
        } else fx.push({
            kind: "status",
            title: a,
            sub: "No screen is open",
            icon: "⟳",
            color: "#8a93a3"
        });
        return;
    }
    if (a === "retry") {
        if (s.lastCmd && HANDLERS[s.lastCmd.tool]) {
            const c = parseDSL(s.lastCmd.line)[0];
            HANDLERS[c.tool](s, c.params, fx, warn);
            return;
        }
        if (s.list) {
            s.list.page = 0;
            s.list.sel = -1;
            s.screen = "list";
            fx.push({
                kind: "list"
            });
            return;
        }
        fx.push({
            kind: "status",
            title: "retry",
            sub: "Nothing to retry",
            icon: "⟳",
            color: "#8a93a3"
        });
        return;
    }
    if (a === "stop") {
        const L = s.last;
        if (L && L.tool === "general") {
            fx.push({
                kind: "status",
                title: "Stopped",
                sub: s.list ? s.list.title : "",
                icon: "■",
                color: "#8a93a3"
            });
            return;
        }
        if (L && [ "ac", "seat", "light", "win", "shade" ].includes(L.tool)) {
            const c = parseDSL(L.line)[0];
            const q = {
                action: "off"
            };
            for (const k of [ "zone", "mode", "target" ]) if (c.params[k]) q[k] = c.params[k];
            if (L.tool === "win" || L.tool === "shade" || L.tool === "light") delete q.target;
            if (L.tool === "light") delete q.mode;
            HANDLERS[L.tool](s, q, fx, warn);
            return;
        }
        if (s.video && s.video.playing && (sc === "video" || !s.music.playing)) {
            s.video.playing = false;
            s.screen = "video";
            fx.push({
                kind: "video"
            });
            return;
        }
        if (s.music.playing) {
            s.music.playing = false;
            if (sc === "idle") s.screen = "music";
            fx.push({
                kind: "music"
            });
            return;
        }
        fx.push({
            kind: "status",
            title: "Stopped",
            sub: "",
            icon: "■",
            color: "#8a93a3"
        });
        return;
    }
    if (a === "play" || a === "pause") {
        if (a === "play" && idx && s.list) {
            s.list.sel = idx - 1;
            const it = s.list.items[idx - 1];
            if (it) {
                if (s.list.kind === "shows") {
                    s.video = {
                        name: it.name,
                        ep: "1",
                        type: it.meta,
                        actor: "",
                        source: "iQIYI",
                        playing: true,
                        pos: 0,
                        dur: 5400
                    };
                    s.screen = "video";
                } else {
                    s.music.song = it.name;
                    s.music.playing = true;
                    s.screen = "music";
                }
                fx.push({
                    kind: "list"
                });
                return;
            }
        }
        if (s.video && (sc === "video" || !s.music.playing)) {
            s.video.playing = a === "play";
            s.screen = "video";
            fx.push({
                kind: "video"
            });
            return;
        }
        s.music.playing = a === "play";
        if (s.screen === "idle") s.screen = "music";
        fx.push({
            kind: "music"
        });
        return;
    }
    if (!s.list && (a === "save" || a === "share") && !p.object) {
        fx.push({
            kind: "status",
            title: a === "save" ? "Current settings saved" : "Shared",
            sub: s.last ? s.last.line : "",
            icon: a === "save" ? "✓" : "↗",
            color: "#3fd2ff"
        });
        return;
    }
    if (!s.list) s.list = listFor(s, p.object);
    const L = s.list, pages = Math.max(1, Math.ceil(L.items.length / PAGE));
    if (a === "next page" || a === "swipe down") L.page = Math.min(pages - 1, L.page + 1); else if (a === "previous page" || a === "swipe up") L.page = Math.max(0, L.page - 1); else if (a === "page N") L.page = Math.max(0, Math.min(pages - 1, (idx || 1) - 1)); else if (a === "last page") L.page = pages - 1; else if (a === "item N") {
        L.sel = Math.max(0, Math.min(L.items.length - 1, (idx || 1) - 1));
        L.page = Math.floor(L.sel / PAGE);
    } else if (a === "last item") {
        L.sel = L.items.length - 1;
        L.page = pages - 1;
    } else if (a === "save" || a === "share") {
        if (idx) {
            L.sel = Math.max(0, Math.min(L.items.length - 1, idx - 1));
            L.page = Math.floor(L.sel / PAGE);
        }
        const it = L.items[L.sel] || L.items[L.page * PAGE];
        fx.push({
            kind: "status",
            title: `${a === "save" ? "Saved" : "Shared"}${p.object ? " " + p.object : ""}`,
            sub: it ? it.name : L.title,
            icon: a === "save" ? "✓" : "↗",
            color: "#3fd2ff"
        });
        return;
    } else if (a === "refresh") {
        L.page = 0;
        L.sel = -1;
    } else {
        fx.push({
            kind: "status",
            title: `General · ${a}`,
            sub: L.title,
            icon: "⟳",
            color: "#6f7fe8"
        });
        return;
    }
    s.screen = "list";
    fx.push({
        kind: "list"
    });
};

const FIT = { "nav-dest": 112, "nav-sub": 112, "tour-dest": 190, "panel-status-title": 150, "panel-status-sub": 150 };
function fitTexts() {
    for (const [id, w] of Object.entries(FIT)) {
        const el = document.getElementById(id); if (!el || !el.textContent) continue;
        let full = el.textContent; if (full.endsWith("…") && el.dataset.full && el.dataset.full.startsWith(full.slice(0, -1))) full = el.dataset.full;
        el.dataset.full = full; el.textContent = full;
        const base = +(el.dataset.fs || (el.dataset.fs = el.getAttribute("font-size")));
        let fs = base; el.setAttribute("font-size", fs);
        let n = 0; while (el.getComputedTextLength() > w && fs > base * .6 && n++ < 30) { fs -= .25; el.setAttribute("font-size", fs); }
        if (el.getComputedTextLength() > w) { let t = full; while (t.length > 3 && el.getComputedTextLength() > w) { t = t.slice(0, -1); el.textContent = t.trimEnd() + "…"; } }
    }
    document.querySelectorAll(".card .big, .card .sub").forEach(e => { e.style.fontSize = ""; let fs = parseFloat(getComputedStyle(e).fontSize), n = 0; while (e.scrollWidth > e.clientWidth + 1 && fs > 9 && n++ < 30) { fs -= 1; e.style.fontSize = fs + "px"; } });
}
const _renderFit = render; render = function () { const r = _renderFit.apply(this, arguments); try { fitTexts(); } catch (e) { } return r; };
