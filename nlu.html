<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabin Voice · DSL Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%2314122a%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2728%27 text-anchor=%27middle%27 fill=%27%23ffc46e%27%3ENS%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#06061a;--ink:#ece9f6;--dim:#9a95b8;--gold:#ffc46e;--lilac:#c9b8ff;--vio:#8f7dff;--line:rgba(185,179,220,.16);--card:rgba(22,19,48,.62);--cyan:#3fd2ff;--ind:#6f7fe8;--muted:#8a93a3;
    --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
    --hh:3.2rem;--bh:4.5rem;--gap:.9rem;--pad:.65rem;
    --carh:calc(100vh - var(--hh) - var(--bh) - var(--pad)*2)}
  @supports (height:100dvh){:root{--carh:calc(100dvh - var(--hh) - var(--bh) - var(--pad)*2)}}
  *{box-sizing:border-box}
  html{font-size:clamp(12px,calc(7.4px + .6vw),17px)}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.35 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* layout: header / three columns (steps, car, console) / control bar. Nothing scrolls. */
  .app{position:relative;height:100vh;height:100dvh;overflow:hidden;display:grid;column-gap:var(--gap);padding:0 var(--gap);
    grid-template-columns:minmax(0,1fr) auto minmax(0,1.12fr);grid-template-rows:var(--hh) minmax(0,1fr) var(--bh);
    grid-template-areas:"hd hd hd" "steps car side" "bar bar bar";
    background:radial-gradient(120% 90% at 62% 40%,#1b1640 0%,#0d0b26 46%,#06061a 100%)}

  .hd{grid-area:hd;display:flex;align-items:center;gap:.8rem;min-width:0}
  .hd h1{margin:0;font:700 1.12rem/1 var(--sans);letter-spacing:.01em;white-space:nowrap}
  .hd .sub{color:var(--dim);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hd .sp{flex:1}
  .tagm{font:500 .68rem/1 var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:.38rem .65rem;white-space:nowrap}
  .tagm b{color:var(--lilac);font-weight:600}
  .ghost{height:2rem;padding:0 .8rem;border-radius:99px;border:1px solid var(--line);color:var(--dim);font:500 .8rem/1 var(--sans);white-space:nowrap;display:inline-flex;align-items:center;gap:.4rem;transition:color .2s,border-color .2s,background .2s}
  .ghost:hover,.ghost.on{color:var(--ink);border-color:rgba(201,184,255,.5);background:rgba(201,184,255,.08)}
  .ghost .n{font:600 .68rem/1 var(--mono);color:var(--lilac)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
  .seg button{height:2rem;padding:0 .75rem;font:600 .78rem/1 var(--sans);color:var(--dim);transition:color .2s,background .2s}
  .seg button.on{background:rgba(255,196,110,.16);color:var(--gold)}

  /* the three steps */
  .steps{grid-area:steps;display:flex;flex-direction:column;justify-content:center;gap:.6rem;min-height:0;padding-block:var(--pad)}
  .step{position:relative;border:1px solid var(--line);border-radius:.95rem;background:var(--card);padding:.7rem .9rem .8rem;min-height:0;transition:border-color .35s,box-shadow .35s,background .35s}
  .step + .step::before{content:"";position:absolute;left:1.55rem;top:-.62rem;width:1px;height:.6rem;background:rgba(201,184,255,.35)}
  .lab{display:flex;flex-wrap:wrap;row-gap:.3rem;align-items:center;gap:.5rem;margin-bottom:.5rem;font:600 .68rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);transition:color .3s}
  .lab i{font-style:normal;flex:none;width:1.4rem;height:1.4rem;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(185,179,220,.3);font-size:.72rem;letter-spacing:0;transition:background .3s,color .3s,border-color .3s}
  .lab .by{margin-left:auto;font:500 .64rem/1 var(--mono);letter-spacing:.02em;text-transform:none;color:var(--dim);white-space:nowrap}
  .lab .by b{color:var(--lilac);font-weight:600}
  .lab .cnt{font:600 .64rem/1 var(--mono);letter-spacing:.04em;color:var(--gold);border:1px solid rgba(255,196,110,.4);border-radius:99px;padding:.18rem .4rem}
  .step.was .lab i{border-color:var(--lilac);color:var(--lilac)}
  .step.on{border-color:rgba(255,196,110,.6);background:rgba(34,27,62,.74);box-shadow:0 0 0 1px rgba(255,196,110,.16),0 .5rem 2rem rgba(255,196,110,.08)}
  .step.on .lab{color:var(--gold)}
  .step.on .lab i{background:var(--gold);border-color:var(--gold);color:#1b1230}
  .ph{color:rgba(154,149,184,.75);font-size:.95rem}
  .said{font:500 1.32rem/1.25 var(--sans);letter-spacing:-.005em;overflow-wrap:anywhere;min-height:2.5em;display:flex;align-items:center}
  #result{min-height:3rem;display:flex;align-items:center}
  .said.in{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
  .said q{quotes:"“" "”"}
  .said q::before,.said q::after{color:var(--gold)}
  :lang(zh-CN) .said q{quotes:"「" "」"}
  .chips{display:flex;flex-wrap:wrap;gap:.38rem;min-height:4.1rem;align-items:center;align-content:center}
  .chip{display:inline-flex;align-items:baseline;gap:.42rem;padding:.32rem .62rem;border-radius:.62rem;background:rgba(201,184,255,.09);border:1px solid rgba(201,184,255,.24);font:500 .95rem/1.15 var(--sans);animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
  .chip em{font:600 .6rem/1 var(--mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--lilac)}
  .chip.dev{background:rgba(255,196,110,.13);border-color:rgba(255,196,110,.45)}
  .chip.dev em{color:var(--gold)}
  .raw{margin-top:.5rem;font:400 .72rem/1.4 var(--mono);color:rgba(154,149,184,.9);overflow-wrap:anywhere;min-height:1em}
  .raw span{font-weight:600;font-size:.6rem;letter-spacing:.1em;color:rgba(154,149,184,.7);margin-right:.5rem}
  .think{display:inline-flex;align-items:center;gap:.55rem;color:var(--lilac);font-size:.95rem}
  .think u{display:inline-flex;gap:.25rem;text-decoration:none}
  .think u s{width:.42rem;height:.42rem;border-radius:50%;background:var(--lilac);animation:dot 1s ease-in-out infinite}
  .think u s:nth-child(2){animation-delay:.15s}.think u s:nth-child(3){animation-delay:.3s}
  .res{display:flex;align-items:center;gap:.6rem;font:600 1.2rem/1.25 var(--sans);animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
  .res .ok{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--gold);color:#1b1230;display:grid;place-items:center}
  .res .ok svg{width:.85rem;height:.85rem}
  .res.no .ok{background:#ff9a7a}
  @keyframes rise{from{opacity:0;transform:translateY(.4rem)}to{opacity:1;transform:none}}
  @keyframes dot{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}

  /* the cabin: car + centre console */
  .carcell{grid-area:car;align-self:center;position:relative;height:var(--carh);width:calc(var(--carh)*348/740);max-width:30vw}
  .carcell svg#car{display:block;width:100%;height:100%;overflow:visible}
  .side{grid-area:side;display:flex;flex-direction:column;justify-content:center;gap:.6rem;min-height:0;min-width:0;padding-block:var(--pad)}
  .panelcell{flex:none;width:100%;aspect-ratio:480/296;max-height:64%;min-height:0}
  .panelcell svg#panel{display:block;width:100%;height:100%}
  .ring{fill:rgba(255,196,110,.07);stroke:#ffc46e;stroke-width:2px;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px rgba(255,196,110,.95));pointer-events:none;animation:fring 1s ease-out 2 both,fstay .6s 2s ease-out forwards}
  @keyframes fring{0%{opacity:0;stroke-width:7px}35%{opacity:1}100%{opacity:1;stroke-width:2px}}
  @keyframes fstay{to{opacity:.75;fill:rgba(255,196,110,0)}}
  #pulseLayer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
  #pulseLayer path{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,196,110,.9));stroke-dasharray:6 9;animation:dash .9s linear infinite;opacity:.9;transition:opacity .45s}
  @keyframes dash{to{stroke-dashoffset:-30}}

  /* history: inline under the console when there is room, a pop-over otherwise */
  .log{display:none;flex-direction:column;min-height:0}
  .log h2{margin:0 0 .45rem;font:600 .66rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
  .loglist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.3rem;scrollbar-width:thin;scrollbar-color:rgba(201,184,255,.3) transparent}
  .le{display:grid;grid-template-columns:1.4rem minmax(0,1fr);column-gap:.4rem;padding:.3rem .1rem;border-top:1px solid rgba(185,179,220,.1);font-size:.85rem}
  .le:first-child{border-top:0}
  .le i{font:600 .68rem/1.6 var(--mono);font-style:normal;color:var(--lilac)}
  .le code{grid-column:2;font:400 .7rem/1.4 var(--mono);color:var(--dim);overflow-wrap:anywhere}
  .pop{position:absolute;z-index:40;display:none;flex-direction:column;background:rgba(14,12,34,.97);border:1px solid rgba(201,184,255,.32);border-radius:1rem;box-shadow:0 1.2rem 3rem rgba(0,0,0,.6);padding:.75rem;min-height:0}
  .pop.show{display:flex}
  .log.show{display:flex;position:absolute;z-index:40;right:var(--gap);top:calc(var(--hh) - .2rem);width:min(24rem,calc(100% - var(--gap)*2));max-height:calc(100% - var(--hh) - var(--bh) - .4rem);background:rgba(14,12,34,.97);border:1px solid rgba(201,184,255,.32);border-radius:1rem;box-shadow:0 1.2rem 3rem rgba(0,0,0,.6);padding:.75rem}
  @media (min-width:841px) and (min-height:521px){
    .log,.log.show{display:flex;position:static;flex:1;width:auto;max-height:none;background:rgba(14,12,34,.4);border:1px solid var(--line);border-radius:.95rem;box-shadow:none;padding:.65rem .8rem}
    #logBtn{display:none}
  }

  /* control bar: Play demo is the one loud thing on the page */
  .bar{grid-area:bar;position:relative;display:flex;align-items:center;gap:.7rem;margin-inline:calc(var(--gap)*-1);padding:0 var(--gap);border-top:1px solid var(--line);background:rgba(8,7,24,.72)}
  .primary{position:relative;flex:none;height:2.95rem;min-width:11.2rem;padding:0 1.5rem 0 1.25rem;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
    background:linear-gradient(180deg,#ffd896 0%,#ffc46e 55%,#f3ab4b 100%);color:#1b1230;font:700 1.08rem/1 var(--sans);letter-spacing:.005em;
    box-shadow:0 .35rem 1.4rem rgba(255,196,110,.38),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .15s,box-shadow .2s,filter .2s}
  .primary:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 .5rem 1.8rem rgba(255,196,110,.5),inset 0 1px 0 rgba(255,255,255,.55)}
  .primary:active{transform:translateY(1px)}
  .primary svg{width:1.05rem;height:1.05rem;flex:none}
  .app[data-demo="idle"] .primary::after{content:"";position:absolute;inset:-1px;border-radius:99px;border:2px solid var(--gold);animation:halo 1.8s ease-out infinite;pointer-events:none}
  @keyframes haloS{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.05,1.28)}}
  @keyframes halo{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.16,1.5)}}
  .app[data-demo="playing"] .primary{background:rgba(255,196,110,.14);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold),0 0 1.4rem rgba(255,196,110,.18)}
  .secondary{flex:none;height:2.95rem;padding:0 1.15rem;border-radius:99px;display:inline-flex;align-items:center;gap:.5rem;border:1.5px solid rgba(201,184,255,.55);background:rgba(201,184,255,.09);color:var(--lilac);font:600 1rem/1 var(--sans);transition:background .2s,border-color .2s,color .2s,transform .15s}
  .secondary:hover{background:rgba(201,184,255,.2);border-color:var(--lilac);color:#fff}
  .secondary:active{transform:translateY(1px)}
  .secondary svg{width:1rem;height:1rem;flex:none;transition:transform .5s}
  .secondary.spin svg{transform:rotate(-360deg)}
  .prog{flex:1;min-width:0;display:flex;align-items:center;gap:.7rem}
  #progTxt{font:600 .9rem/1 var(--mono);white-space:nowrap;color:var(--ink);min-width:3.9rem}
  #progTxt small{font:500 .7rem/1 var(--sans);color:var(--dim);margin-left:.5rem;letter-spacing:.02em}
  .track{flex:1;display:flex;gap:3px;max-width:24rem;min-width:0}
  .track i{flex:1;height:.34rem;border-radius:9px;background:rgba(185,179,220,.16);transition:background .3s,box-shadow .3s}
  .track i.d{background:rgba(201,184,255,.75)}
  .track i.c{background:var(--gold);box-shadow:0 0 .5rem rgba(255,196,110,.8)}
  #tryBtn{height:2.4rem;padding:0 1rem;font-size:.88rem}
  #tryBtn svg{width:1rem;height:1rem;flex:none}
  #tryPop{right:var(--gap);bottom:calc(var(--bh) + .4rem);width:min(25rem,calc(100% - var(--gap)*2));max-height:calc(100% - var(--bh) - var(--hh))}
  .tryrow{display:flex;gap:.4rem;margin-bottom:.5rem;flex:none}
  .tryrow input{flex:1;min-width:0;height:2.3rem;border-radius:.7rem;border:1px solid rgba(201,184,255,.3);background:rgba(6,6,26,.8);color:var(--ink);padding:0 .75rem;font:400 16px/1 var(--sans)}
  .tryrow input::placeholder{color:rgba(154,149,184,.7)}
  .tryrow input:focus{outline:none;border-color:var(--gold)}
  .tryrow button{height:2.3rem;padding:0 .9rem;border-radius:.7rem;background:var(--gold);color:#1b1230;font:700 .85rem/1 var(--sans)}
  .trylist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.15rem;scrollbar-width:thin;scrollbar-color:rgba(201,184,255,.3) transparent}
  .trylist button{text-align:left;padding:.42rem .6rem;border-radius:.55rem;font-size:.9rem;color:var(--ink);transition:background .15s}
  .trylist button:hover{background:rgba(255,196,110,.14);color:var(--gold)}
  .trylist .none{color:var(--dim);font-size:.85rem;padding:.4rem .6rem}

  /* narrow window: steps over console on the left, the car on the right */
  @media (max-width:840px) and (min-height:431px){
    :root{--hh:2.9rem;--bh:4.1rem;--gap:.7rem;--pad:.5rem}
    .app{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:var(--hh) minmax(0,1.32fr) minmax(0,1fr) var(--bh);grid-template-areas:"hd hd" "steps car" "side car" "bar bar"}
    .steps{justify-content:center;gap:.4rem;padding-block:var(--pad) .4rem;overflow:hidden}
    .step{padding:.5rem .7rem .55rem}
    .step + .step::before{top:-.42rem;height:.4rem}
    .lab{margin-bottom:.35rem}
    .said{font-size:1.15rem;min-height:1.3em}
    .res{font-size:1.08rem}
    #result{min-height:1.6rem}
    .chips{min-height:3.7rem}
    .raw{margin-top:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side{padding-block:0 var(--pad)}
    .panelcell{flex:1;aspect-ratio:auto;max-height:none}
    .hd .sub{display:none}
    .carcell{max-width:34vw}
  }
  /* phone: car beside the steps, console underneath */
  @media (max-width:520px){
    html{font-size:12px}
    :root{--hh:2.7rem;--bh:3.9rem;--gap:.55rem;--pad:.4rem;--ch:min(55vw,31vh);--carh:calc(100vh - var(--hh) - var(--bh) - var(--ch) - var(--pad)*2)}
    @supports (height:100dvh){:root{--ch:min(55vw,31dvh);--carh:calc(100dvh - var(--hh) - var(--bh) - var(--ch) - var(--pad)*2)}}
    .app{grid-template-columns:auto minmax(0,1fr);grid-template-rows:var(--hh) minmax(0,1fr) var(--ch) var(--bh);grid-template-areas:"hd hd" "car steps" "side side" "bar bar";column-gap:.5rem}
    .carcell{max-width:40vw}
    .steps{justify-content:center;gap:.4rem;padding-block:var(--pad);overflow:hidden}
    .step{padding:.45rem .55rem .5rem;border-radius:.8rem}
    .lab{margin-bottom:.3rem;font-size:.62rem;letter-spacing:.08em;gap:.35rem}
    .lab i{width:1.2rem;height:1.2rem;font-size:.66rem}
    .lab .by{font-size:.58rem}
    .said{font-size:1.08rem;line-height:1.2;min-height:2.4em}
    #result{min-height:2.4rem}
    .res{font-size:1rem;gap:.4rem;line-height:1.2}
    .res .ok{width:1.25rem;height:1.25rem}
    .ph{font-size:.88rem}
    .chips{gap:.25rem;min-height:3.2rem}
    .chip{padding:.22rem .42rem;font-size:.86rem;gap:.3rem;border-radius:.5rem}
    .chip em{font-size:.54rem;letter-spacing:.06em}
    .raw{margin-top:.3rem;font-size:.64rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side{padding-block:0 var(--pad)}
    .panelcell{flex:1;aspect-ratio:auto;max-height:none}
    .hd{gap:.4rem}
    .hd h1{font-size:1.02rem}
    .hd .sub,.tagm{display:none}
    .ghost{padding:0 .6rem}
    .bar{gap:.45rem}
    .primary{min-width:0;flex:1;height:2.8rem;padding:0 .8rem;font-size:1.05rem}
    .secondary{height:2.8rem;padding:0 .8rem}
    .prog{flex:none;gap:0}
    #progTxt{min-width:0;font-size:.85rem}
    #progTxt small{display:none}
    .track{position:absolute;left:0;right:0;top:-2px;max-width:none;gap:2px}
    .track i{height:3px;border-radius:0}
    #tryBtn{width:2.8rem;height:2.8rem;padding:0;justify-content:center}
    #tryBtn span{display:none}
    .app[data-demo="idle"] .primary::after{animation-name:haloS}
  }
  /* very short and wide (phone on its side): keep three columns, tighten */
  @media (max-height:430px){
    :root{--hh:2.5rem;--bh:3.5rem;--pad:.35rem}
    .steps{gap:.35rem}
    .step{padding:.4rem .65rem .45rem}
    .lab{margin-bottom:.25rem}
    .said{font-size:1.05rem;min-height:1.3em}.res{font-size:1rem}#result{min-height:1.5rem}.chips{min-height:1.8rem}
    .raw{margin-top:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .primary,.secondary{height:2.5rem}
    .hd .sub{display:none}
    .panelcell{max-height:100%}
  }
  /* very small phones: drop the raw line (the chips already say it) and tighten the sentence */
  @media (max-width:520px) and (max-height:520px){
    .raw{display:none}
    .said{font-size:.98rem;min-height:2.3em}
    .chips{min-height:2.6rem}
  }
  /* small layouts: the console is cropped to its screen and controls (see fitConsole) and drawn as a card of exactly that shape */
  @media (max-width:840px),(max-height:430px){
    .panelcell{flex:1;min-height:0;aspect-ratio:auto;max-height:none;container-type:size;display:grid;place-items:center}
    .panelcell svg#panel{width:min(100cqw,100cqh*336/186);height:min(100cqh,100cqw*186/336);border-radius:.9rem;border:1px solid rgba(111,127,232,.45);background:#141733;box-shadow:0 .6rem 1.6rem rgba(0,0,0,.35)}
  }
  @media (prefers-reduced-motion:reduce){.app[data-demo="idle"] .primary::after{animation:none;opacity:0}.chip,.res,.said.in{animation:none}}
  #rapps .rapp{cursor:pointer;transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s;transform-box:fill-box;transform-origin:center}
  #rapps .rapp:hover{transform:scale(1.08)}
  #rapps .rapp.on rect{stroke:#fff;stroke-width:1.6;filter:url(#pGlow)}
  #rapps .rapp.on{transform:scale(1.12)}
  #panel-apps.hidden #rapps .rapp{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0;pointer-events:none}
  #panel-models.hidden #panel-model-gear{transform:translate(0,37px) scale(.1);opacity:0;transition-delay:0s}
  #panel-models.hidden #panel-model-plug{transform:translate(0,58px) scale(.1)!important;opacity:0}
  #panel-model-gear{transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s;transform-box:fill-box;transform-origin:center}
  #panel-screen > g[opacity="0"], #app-ui-phone > g[opacity="0"]{pointer-events:none}   
  .hl{animation:hl 1.2s ease-out}

  #zones rect{transition:fill .8s,opacity .8s}

  #panel-wave line:nth-child(1){animation-delay:0s}#panel-wave line:nth-child(2){animation-delay:.15s}#panel-wave line:nth-child(3){animation-delay:.3s}#panel-wave line:nth-child(4){animation-delay:.45s}#panel-wave line:nth-child(5){animation-delay:.3s}#panel-wave line:nth-child(6){animation-delay:.15s}#panel-wave line:nth-child(7){animation-delay:0s}
  @keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
  #panel-screen.speaking #panel-wave line{animation:speak .38s ease-in-out infinite}
  @keyframes speak{0%,100%{transform:scaleY(.35)}30%{transform:scaleY(1.25)}60%{transform:scaleY(.7)}}
  #panel-idle text:last-of-type{animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  #sunroof-panel{transition:transform .9s cubic-bezier(.4,0,.2,1)}
  #side-windows rect{transition:y .3s,height .3s}
  #win-sunroof rect{transition:all .9s cubic-bezier(.4,0,.2,1)}
  #sunroof-lip{transition:opacity .25s}
  .knob{cursor:grab}.knob:active{cursor:grabbing}
  .mbtn{cursor:pointer}.mbtn:hover path,.mbtn:hover circle{filter:url(#pGlow)}
  #side-windows rect{cursor:ns-resize}
  #win-sunroof{cursor:pointer}
  #win-sunroof rect{transition:none}
  #panel-apps g[id^="panel-app-"]{cursor:pointer;transition:transform .25s cubic-bezier(.4,0,.2,1);transform-box:fill-box;transform-origin:center}
  #panel-apps g[id^="panel-app-"]:hover{transform:scale(1.08)}
  #panel-apps g[id^="panel-app-"].on rect{stroke:#fff;stroke-width:1.6;filter:url(#pGlow)}
  #panel-apps g[id^="panel-app-"].on{transform:scale(1.12)}
  #panel-apps g[id^="panel-app-"]{transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s}

  #panel-apps.hidden #panel-app-music{transform:translate(0,142px) scale(.1);opacity:0;transition-delay:.06s}
  #panel-apps.hidden #panel-app-phone{transform:translate(0,106px) scale(.1);opacity:0;transition-delay:0s}
  #panel-apps:not(.hidden) #panel-app-phone{transition-delay:.12s}
  #panel-apps:not(.hidden) #panel-app-music{transition-delay:.06s}
  #panel-apps.hidden text{opacity:0}
  #panel-apps text{transition:opacity .3s}
  #panel-idle,#panel-status,#app-ui-nav,#app-ui-music,#app-ui-phone{transition:opacity .35s}
  #music-ring{transform-box:fill-box;transform-origin:center;transform:scale(.18)}
  #panel-models g[id^="panel-model-"]{cursor:pointer;transition:transform .45s cubic-bezier(.34,1.3,.64,1),opacity .3s;transform-box:fill-box;transform-origin:center}
  #panel-models g[id^="panel-model-"]:hover{transform:scale(1.08)}
  #panel-models g[data-model].on rect{stroke:#fff;stroke-width:1.6;filter:url(#pGlow)}
  #panel-models g[data-model].on{transform:scale(1.12)}
  #panel-models.hidden #panel-model-A{transform:translate(0,117px) scale(.1);opacity:0;transition-delay:.12s}
  #panel-models.hidden #panel-model-B{transform:translate(0,77px) scale(.1);opacity:0;transition-delay:.06s}
  #panel-models.hidden #panel-model-plug{transform:translate(0,98px) scale(.1);opacity:0;transition-delay:0s}
  #panel-models:not(.hidden) #panel-model-plug{transition-delay:.12s}
  #panel-models:not(.hidden) #panel-model-B{transition-delay:.06s}
  #panel-models.hidden > text{opacity:0}
  #panel-models > text{transition:opacity .3s}
  #panel-model-plug{cursor:default}
  #models-toggle-icon{transition:transform .35s;transform-box:fill-box;transform-origin:center}
  #models-toggle.open #models-toggle-icon{transform:rotate(45deg)}
  #apps-toggle-icon{transition:transform .35s;transform-box:fill-box;transform-origin:center}
  #apps-toggle.open #apps-toggle-icon{transform:rotate(45deg)}
</style>
</head>

<div class="app" id="app" data-demo="idle" data-phase="idle">

<script>const $ = id => document.getElementById(id);

function initialState() {

        },

        },

}

let state = initialState();

const RANGE = {

const AC = {

    direction: [ "up", "mid", "down" ],
    mode: [ "cool", "heat", "dehumidify", "auto", "fan", "defog", "defrost" ],
    circ: [ "auto", "recirculate", "fresh air", "dual loop" ],
    target: [ "temperature", "fan speed" ]
};

const ZONE_TEMP = {
    "front row": [ "lf", "rf" ],
    "rear row": [ "rear" ],
    "whole car": [ "lf", "rf", "rear" ],
    "driver": [ "lf" ],
    "passenger": [ "rf" ]
};

const WIN_S = {
    action: [ "on", "off", "set", "increase", "decrease" ],
    zone: [ "front left", "front right", "rear left", "rear right", "all", "front row", "rear row", "sunroof", "driver", "passenger" ],
    mode: [ "ventilation", "air" ]
};

const ZONE_WIN = {
    "front left": [ "lf" ],
    "driver": [ "lf" ],
    "front right": [ "rf" ],
    "passenger": [ "rf" ],
    "rear left": [ "lr" ],
    "rear right": [ "rr" ],
    "front row": [ "lf", "rf" ],
    "rear row": [ "lr", "rr" ],
    "all": [ "lf", "rf", "lr", "rr" ],
    "sunroof": [ "sunroof" ]
};

const SHADE_S = {
    action: [ "on", "off", "set", "increase", "decrease" ],
    zone: [ "front row", "rear row", "all" ]
};

const SEAT_S = {
    action: [ "on", "off", "set", "increase", "decrease" ],
    zone: [ "front left", "front right", "rear left", "rear right", "all", "front row", "rear row", "driver", "passenger" ],
    mode: [ "heating", "massage", "ventilation" ]
};

const ZONE_SEAT = {
    "front left": [ "lf" ],
    "driver": [ "lf" ],
    "front right": [ "rf" ],
    "passenger": [ "rf" ],
    "rear left": [ "lr" ],
    "rear right": [ "rr" ],
    "front row": [ "lf", "rf" ],
    "rear row": [ "lr", "rm", "rr" ],
    "all": [ "lf", "rf", "lr", "rm", "rr" ]
};

const MODE_KEY = {
    "heating": "heat",
    "ventilation": "vent",
    "massage": "massage"
};

const VOL_S = {
    action: [ "set", "increase", "decrease", "mute", "unmute" ],
    target: [ "media", "navigate", "voice", "system", "phone", "radio", "ringtone", "mic", "bluetooth" ]
};

const LIGHT_S = {
    action: [ "on", "off", "set", "increase", "decrease" ],
    mode: [ "colour", "brightness" ]
};

const COLORS = {
    "red": "#ff3b3b",
    "orange": "#ff8c42",
    "yellow": "#ffd93d",
    "green": "#3ddc84",
    "cyan": "#2fd1d1",
    "blue": "#3f8cff",
    "purple": "#a855f7",
    "pink": "#ff6ab5",
    "white": "#f2f4ff",
    "ice blue": "#7fe9ff",
    "sky blue": "#7cc9ff",
    "lake blue": "#2bb5d9",
    "deep blue": "#2b4bd6",
    "rose gold": "#e8a8a0",
    "gold": "#f5c542",
    "amber": "#f0a500",
    "warm white": "#ffe3b8",
    "lilac": "#c084fc",
    "magenta": "#d946ef",
    "mint": "#5ef0c4",
    "dark green": "#1e8a5c",
    "coral": "#ff7f6e",
    "sakura pink": "#ffb7d5",
    "tangerine": "#ff8c42",
    "indigo": "#4b4fd6",
    "grey": "#9aa3b5",
    "black": "#2a2f45"
};

function colorToHex(name) {
    if (!name) return null;
    let n = name.replace(/ colou?r$/, "").replace(/^(bright |pale |dark |light |neon )/, m => m);
    if (COLORS[n]) return COLORS[n];
    const n2 = n.replace(/^(bright |pale |light |dark |neon )/, "");
    if (COLORS[n2]) return COLORS[n2];
    for (const k in COLORS) if (n.endsWith(k)) return COLORS[k];
    return null;
}

const ZONE_SHADE = {
    "front row": [ "front" ],
    "rear row": [ "rear" ],
    "all": [ "front", "rear" ]
};

function parseDSL(text) {
    return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
        const m = line.match(/^(\w+)\s*:\s*(.*)$/);
        if (!m) return {
            tool: null,
            raw: line,
            params: {}
        };
        const params = {};
        m[2].split(/\s+/).filter(Boolean).forEach(kv => {
            const i = kv.indexOf("|");
            if (i > 0) {
                const v = kv.slice(i + 1);
                if (v !== "") params[kv.slice(0, i)] = v.replace(/_/g, " ");
            } else params[kv] = "";
        });
        return {
            tool: m[1],
            raw: line,
            params: params
        };
    });
}

function num(v, [lo, hi], cur) {
    if (v == null) return null;
    if (v === "min") return lo;
    if (v === "max") return hi;
    if (v === "half") return Math.floor((lo + hi) / 2);
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
}

const clamp = (n, [lo, hi]) => Math.max(lo, Math.min(hi, n));

function applyDSL(prev, text) {
    const s = JSON.parse(JSON.stringify(prev));
    const effects = [], warnings = [];
    for (const call of parseDSL(text)) {
        if (!call.tool) {
            warnings.push(`Cannot parse: ${call.raw}`);
            continue;
        }
        const h = HANDLERS[call.tool];
        if (!h) {
            warnings.push(`Tool not implemented ${call.tool} (not in this demo)`);
            continue;
        }
        h(s, call.params, effects, warnings, call.raw);
    }
    return {
        state: s,
        effects: effects,
        warnings: warnings
    };
}

const HANDLERS = {
    ac(s, p, fx, warn) {
        const A = s.ac;
        for (const k of [ "action", "zone", "direction", "mode", "circ", "target" ]) if (p[k] != null && !AC[k].includes(p[k])) {
            warn.push(`ac.${k} value “${p[k]}” is not in the schema , ignored`);
            delete p[k];
        }
        if (p.degree != null && num(p.degree, [ 0, 99 ]) == null) {
            warn.push(`ac.degree“${p.degree}” is not a number, ignored`);
            delete p.degree;
        }
        let act = p.action;
        if (!act) act = p.degree != null ? "set" : "query";
        const z = p.zone;
        if (z === "mirrors") {
            A.mirror = act !== "off";
            fx.push({
                kind: "mirror"
            });
            return;
        }
        if ([ "windshield", "rear glass", "all glass", "rear window" ].includes(z) || [ "defog", "defrost" ].includes(p.mode)) {
            const fr = [ "windshield", "all glass" ].includes(z) || !z && p.mode, re = [ "rear glass", "all glass", "rear window" ].includes(z), on = act !== "off";
            if (fr) {
                A.defog.front = on;
                if (on) s.scene.fogFront = false;
                fx.push({
                    kind: "defog",
                    side: "front"
                });
            }
            if (re) {
                A.defog.rear = on;
                fx.push({
                    kind: "defog",
                    side: "rear"
                });
            }
            return;
        }
        const zones = ZONE_TEMP[z] || ZONE_TEMP["whole car"];
        const Z = zones.map(k => A.zone[k]);
        if (act === "query") {
            const NAME = {
                lf: "driver",
                rf: "passenger",
                rear: "rear row"
            };
            const one = k => {
                const q = A.zone[k];
                return q.on ? `${q.temp}℃ fan ${q.fan}${q.mode ? " " + q.mode : ""}` : "Closed";
            };
            let what;
            if (p.circ) what = `Circulation: ${Z[0].circ || "unset"}`; else if (p.target === "fan speed") what = zones.map(k => `${NAME[k]} ${A.zone[k].on ? "Fan " + A.zone[k].fan : "Closed"}`).join(" · "); else if (p.target === "temperature") what = zones.map(k => `${NAME[k]} ${A.zone[k].on ? A.zone[k].temp + "℃" : "Closed"}`).join(" · "); else if (z && zones.length === 1) what = one(zones[0]); else what = zones.map(k => `${NAME[k]} ${one(k)}`).join(" · ");
            fx.push({
                kind: "status",
                title: `A/C${z ? " · " + z : ""}`,
                sub: what
            });
            return;
        }
        if (act === "off") {
            Z.forEach(q => Object.assign(q, {
                on: false,
                fan: 0,
                mode: null
            }));
            fx.push({
                kind: "ac",
                zones: zones
            });
            return;
        }
        if (act === "on") {
            Z.forEach(q => {
                q.on = true;
                if (q.fan === 0) q.fan = 3;
            });
        }
        if (p.mode) {
            Z.forEach(q => {
                q.mode = p.mode;
                q.on = true;
                if (q.fan === 0) q.fan = 3;
            });
        }
        if (p.circ) {
            Z.forEach(q => {
                q.circ = p.circ;
            });
        }
        if (p.direction) {
            A.direction = p.direction;
        }
        let target = p.target;
        if (!target && p.degree != null) target = "temperature";
        if (target && p.degree == null && (act === "increase" || act === "decrease")) p.degree = "1";
        const rel = act === "increase" ? 1 : act === "decrease" ? -1 : 0;
        const apply = (cur, deg, range) => {
            if (deg === "half" && rel) return clamp(rel > 0 ? cur * 1.5 : cur / 2, range) | 0;
            const d = num(deg, range);
            if (d == null) return null;
            return clamp(rel ? cur + rel * d : d, range);
        };
        if (target === "temperature") {
            Z.forEach(q => {
                const v = apply(q.temp, p.degree, RANGE.temp);
                if (v == null) warn.push("ac: no degree, temperature unchanged"); else {
                    q.temp = v;
                    q.on = true;
                    if (q.fan === 0) q.fan = 3;
                }
            });
            fx.push({
                kind: "temp",
                zones: zones
            });
        } else if (target === "fan speed") {
            Z.forEach(q => {
                const v = apply(q.fan, p.degree, RANGE.fan);
                if (v == null) warn.push("ac: no degree, fan speed unchanged"); else {
                    q.fan = v;
                    q.on = v > 0;
                }
            });
        }
        fx.push({
            kind: "ac",
            zones: zones
        });
    },
    win(s, p, fx, warn) {
        const W = s.win;
        if (p.action === "query") {
            const N = {
                lf: "front left",
                rf: "front right",
                lr: "rear left",
                rr: "rear right",
                sunroof: "sunroof"
            };
            const ks = ZONE_WIN[p.zone] || [ "lf", "rf", "lr", "rr", "sunroof" ];
            const one = k => W[k] === 0 ? "off" : W[k] >= 10 ? "fully open" : `on ${W[k] * 10}%`;
            fx.push({
                kind: "status",
                title: `Windows${p.zone ? " · " + p.zone : ""}${ks.length === 1 ? ": " + one(ks[0]) : ""}`,
                sub: ks.length === 1 ? "" : ks.map(k => `${N[k]} ${one(k)}`).join(" · "),
                icon: "W",
                color: "#3fd2ff"
            });
            return;
        }
        for (const k of [ "action", "zone", "mode" ]) if (p[k] != null && !WIN_S[k].includes(p[k])) {
            warn.push(`win.${k} value “${p[k]}” is not in the schema , ignored`);
            delete p[k];
        }
        if (p.degree != null && num(p.degree, [ 0, 99 ]) == null) {
            warn.push(`win.degree“${p.degree}” is not a number, ignored`);
            delete p.degree;
        }
        const act = p.action || (p.degree != null ? "set" : "on");
        const zones = ZONE_WIN[p.zone] || ZONE_WIN["all"];
        let d = num(p.degree, RANGE.win);
        zones.forEach(k => {
            const cur = W[k];
            if (act === "off") W[k] = 0; else if (act === "on") W[k] = d != null ? d : p.mode ? 1 : 10; else if (act === "set") {
                if (d == null) {
                    if (p.mode) W[k] = 1; else {
                        warn.push("win: set is missing degree");
                        return;
                    }
                } else W[k] = d;
            } else if (act === "decrease") W[k] = clamp(cur + (d == null ? 1 : d), RANGE.win); else if (act === "increase") W[k] = clamp(cur - (d == null ? 1 : d), RANGE.win);
            W[k] = clamp(W[k], RANGE.win);
        });
        fx.push({
            kind: "win",
            zones: zones
        });
    },
    shade(s, p, fx, warn) {
        const S = s.shade;
        for (const k of [ "action", "zone" ]) if (p[k] != null && !SHADE_S[k].includes(p[k])) {
            warn.push(`shade.${k} value “${p[k]}” is not in the schema , ignored`);
            delete p[k];
        }
        if (p.degree != null && num(p.degree, [ 0, 99 ]) == null) {
            warn.push(`shade.degree“${p.degree}” is not a number, ignored`);
            delete p.degree;
        }
        const act = p.action || (p.degree != null ? "set" : "on");
        const zones = ZONE_SHADE[p.zone] || ZONE_SHADE["all"];
        const d = num(p.degree, RANGE.shade);

function tempColor(t) {
    const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
    const cold = [ 63, 210, 255 ], mid = [ 111, 127, 232 ], warm = [ 255, 106, 61 ];
    const c = t <= 24 ? mix(cold, mid, (t - 16) / 8) : mix(mid, warm, (t - 24) / 8);
    return `rgb(${c.join(",")})`;
}

    "cool": "#3fd2ff",
    "heat": "#ff6a3d",

const SH = {
    f: 0,
    r: 0,
    tf: 0,
    tr: 0,
    t0: 0,
    f0: 0,
    r0: 0,
    raf: 0
};

function drawShade(hF, hR) {
    hF = Math.max(0, hF);
    hR = Math.max(0, hR);
    const f = $("shade-front");
    f.querySelectorAll("rect").forEach(q => q.setAttribute("height", hF));
    const fl = f.querySelector("line");
    fl.setAttribute("y1", 259 + hF);
    fl.setAttribute("y2", 259 + hF);
    fl.setAttribute("opacity", hF > .5 ? 1 : 0);
    const r = $("shade-rear");
    r.querySelectorAll("rect").forEach(q => {
        q.setAttribute("y", 613 - hR);
        q.setAttribute("height", hR);
    });
    const rl = r.querySelector("line");
    rl.setAttribute("y1", 613 - hR);
    rl.setAttribute("y2", 613 - hR);
    rl.setAttribute("opacity", hR > .5 ? 1 : 0);
}

function shadeTo(tf, tr) {
    if (tf === SH.tf && tr === SH.tr) return;
    SH.tf = tf;
    SH.tr = tr;
    SH.f0 = SH.f;
    SH.r0 = SH.r;
    SH.t0 = performance.now();
    cancelAnimationFrame(SH.raf);
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const step = now => {
        const k = Math.min(1, (now - SH.t0) / 900), e = ease(k);
        SH.f = SH.f0 + (SH.tf - SH.f0) * e;
        SH.r = SH.r0 + (SH.tr - SH.r0) * e;
        drawShade(SH.f, SH.r);
        if (k < 1) SH.raf = requestAnimationFrame(step);
    };
    SH.raf = requestAnimationFrame(step);
}

(function loop() {
    let html = "";
    for (const v of VENTS) {
        const want = v.level * 3, speed = .004 + v.level * .0016;
        while (v.ps.length < want) v.ps.push({
            t: Math.random(),
            x: (Math.random() - .5) * 18
        });
        while (v.ps.length > want) v.ps.pop();
        for (const p of v.ps) {
            p.t += speed;
            if (p.t > 1) {
                p.t = 0;
                p.x = (Math.random() - .5) * 18;
            }
            const y = v.y + v.len * p.t, x = v.x + p.x + v.dx * v.len * p.t;
            html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.6 * (1 - p.t * .6)).toFixed(2)}" fill="${v.color}" opacity="${(.9 * (1 - p.t)).toFixed(2)}"/>`;
        }
    }
    $("ac-flows").innerHTML = html;
    requestAnimationFrame(loop);
})();

function playEffects(fx) {
    for (const e of fx) {
        if (e.kind === "defog") {
            const id = e.side === "front" ? "glass-front" : "glass-rear";
            flash(id);
        }
        if (e.kind === "temp") {
            e.zones.forEach(z => flash("temp-" + z));
        }
        if (e.kind === "mirror") {
            flash("mirror-l");
            flash("mirror-r");
        }
        if (e.kind === "win") {
            e.zones.forEach(z => flash("win-" + z));
        }
        if (e.kind === "seat") {
            e.zones.forEach(z => flash("seat-" + z));
        }
        if (e.kind === "volume") {
            if (e.target !== "media") showStatus(`${e.target}volume`, state.muted.media ? "mute" : `${state.vol[e.target]} / 40`, "#3fd2ff"), 
            setTimeout(() => showScreen("panel-idle"), 2500);
        }
        if (e.kind === "light") {
            [ "light-dash", "light-door-l", "light-door-r", "light-foot", "panel-light" ].forEach(flash);
        }
        if (e.kind === "shade") {
            e.zones.forEach(z => flash("shade-" + z));
        }
        if (e.kind === "ac") {
            const v = [];
            if (e.zones.includes("lf")) v.push("ac-front-l", "ac-front-c");
            if (e.zones.includes("rf")) v.push("ac-front-r", "ac-front-c");
            if (e.zones.includes("rear")) v.push("ac-rear");
            [ ...new Set(v) ].forEach(flash);
        }
        if (e.kind === "status") {
            showStatus(e.title, e.sub, e.color || "#3fd2ff", e.icon || "i");
            if (e.shake) {
                const sc = $("panel-screen");
                sc.classList.remove("shake");
                void sc.getBBox();
                sc.classList.add("shake");
            }
            clearTimeout(statusTimer);
            statusTimer = setTimeout(() => {
                if (state.screen === "status") state.screen = prevScreen;
                render();
            }, 3e3);
        }
        if (e.kind === "swipe") {
            swipeVol(e.dir);
        }
        if (e.kind === "music" || e.kind === "nav" || e.kind === "phone" || e.kind === "screen") {}
    }
}

function flash(id) {
    const el = $(id);
    if (!el) return;
    el.classList.remove("hl");
    void (el.getBBox ? el.getBBox() : el.offsetWidth);
    el.classList.add("hl");
    setTimeout(() => el.classList.remove("hl"), 1300);
}

function svgPt(svg, ev) {
    const root = svg.ownerSVGElement || svg;
    const pt = root.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
}

        }, {
            transform: "scale(1)"
        } ], {
            duration: 450,
            easing: "cubic-bezier(.4,0,.2,1)",

        });
        a.onfinish = () => {
            a.cancel();
            ring.animate([ {
                transform: "scale(1)"
            }, {
                transform: "scale(1.18)"
            }, {
                transform: "scale(1)"
            } ], {
                duration: 1600,
                iterations: Infinity,
                easing: "ease-in-out"
            });

    } else ring.animate([ {
        transform: `scale(${s0})`
    }, {
        transform: "scale(.18)"

        duration: 450,
        easing: "cubic-bezier(.4,0,.2,1)",
        fill: "forwards"

function swipeVol(dir) {
    if (volAnim) return;
    volAnim = true;
    const bar = $("media-volbar"), W = 130, w0 = W * (state.muted.media ? 0 : state.vol.media) / 40, T1 = 260, T2 = 320, ease = t => 1 - Math.pow(1 - t, 3), t0 = performance.now();

        let w;
        if (t < T1) w = dir > 0 ? w0 + (W - w0) * ease(t / T1) : w0 * (1 - ease(t / T1)); else if (t < T1 + T2) w = dir > 0 ? w0 * ease((t - T1) / T2) : W - (W - w0) * ease((t - T1) / T2); else {
            bar.setAttribute("width", w0);
            volAnim = false;
            return;
        }
        bar.setAttribute("width", Math.max(0, w));
        requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}

const DEMO_ZH = [ "打开主驾座椅加热", "左后车窗开一半", "氛围灯调成蓝色", "打开遮阳帘", "打开天窗", "打开除雾", "温度调到24度", "再低两度", "导航去深圳北站，不走高速", "显示路况", "三公里内有加油站吗？", "第三个", "播放周杰伦的七里香", "收藏这首歌", "打开空调，再放一首周杰伦的歌" ];

const DEMO_DSL = [
    "seat: action|on zone|driver mode|heating",
    "win: action|on zone|rear_left degree|half",
    "light: action|set mode|colour color|blue",
    "shade: action|on zone|rear_row",            /* rear sunshade only: the front one stays closed */
    "win: action|on zone|sunroof",
    "ac: action|on mode|defog",
    "ac: action|set target|temperature degree|24",
    "ac: action|decrease target|temperature degree|2",
    "nav: action|navigate end|Shenzhen_North_Station route|avoid_highways",
    "nav: action|on target|traffic",
    "nav: action|search search|gas_station distance|3 unit|km",
    "general: action|item_N index|3",
    "music: action|play singer|Jay_Chou song|Qi_Li_Xiang",
    "music: action|favourite",
    "ac: action|on\nmusic: action|next singer|Jay_Chou"
];

const SCRIPT = {};

DEMO_EN.forEach((s, i) => SCRIPT[s] = DEMO_DSL[i]);

DEMO_ZH.forEach((s, i) => SCRIPT[s] = DEMO_DSL[i]);

const DEMO_N = DEMO_EN.length;

const demoList = () => lang === "zh" ? DEMO_ZH : DEMO_EN;

const sentIdx = t => {
    const i = DEMO_EN.indexOf(t);
    return i >= 0 ? i : DEMO_ZH.indexOf(t);
};

/* a scripted sentence is shown in the current language; anything typed is shown as typed */
const inLang = t => {
    const i = sentIdx(t);
    return i < 0 ? t : demoList()[i];
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let gen = 0;       /* bumped by Reset: a sentence still in flight stops touching the cabin */
let cur = null;    /* the sentence on screen: { text, lines, li, phase, res } */
let logItems = [];

/* typed text: exact scripted sentence, or the closest one if it is close enough */
const normS = s => String(s).toLowerCase().replace(/[\s.,!?;:'"’“”，。！？、；：-]+/g, " ").trim();

const STOPW = new Set([ "the", "a", "an", "to", "please", "my", "of", "me" ]);

const dice = (a, b) => {
    const A = new Set(a), B = new Set(b);
    if (!A.size || !B.size) return 0;
    let n = 0;
    A.forEach(x => B.has(x) && n++);
    return 2 * n / (A.size + B.size);
};

const grams = s => {
    const t = s.replace(/ /g, ""), o = [];
    for (let i = 0; i < t.length - 1; i++) o.push(t.slice(i, i + 2));
    return o.length ? o : [ t ];
};

function matchScript(q) {
    if (SCRIPT[q]) return q;
    const n = normS(q);
    if (!n) return null;
    const cjk = /[一-鿿]/;
    let best = null, bs = 0;
    for (const k of Object.keys(SCRIPT)) {
        const m = normS(k);
        if (m === n) return k;
        if (cjk.test(k) !== cjk.test(n)) continue;
        const wn = n.split(" ").filter(w => !STOPW.has(w)), wm = m.split(" ").filter(w => !STOPW.has(w));
        const sc = cjk.test(k) ? dice(grams(n), grams(m)) : Math.max(dice(wn, wm), dice(grams(wn.join("")), grams(wm.join(""))));
        if (sc > bs) bs = sc, best = k;
    }
    return bs >= .72 ? best : null;
}

async function infer(text) {
    await sleep(520);
    const key = matchScript(text);
    return {
        dsl: key ? SCRIPT[key] : "reject: action|unsupported",
        key: key,
        scripted: true
    };
}

async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    busy = true;
    const g = gen, dead = () => g !== gen;
    cur = { text: text, lines: [], li: 0, phase: "said", res: [], fresh: true };
    clearRings();
    paintSteps();
    cur.fresh = false;
    await sleep(650);
    if (dead()) return;
    cur.phase = "think";
    paintSteps();
    let res;
    try {
        res = await infer(text);
    } catch (e) {
        res = { dsl: "reject: action|unsupported", scripted: true };
    }
    if (dead()) return;
    lastResult = res;
    const lines = (res.dsl || "").split("\n").map(l => l.trim()).filter(Boolean);
    cur.lines = lines;
    for (let i = 0; i < lines.length; i++) {
        cur.li = i;
        cur.phase = "understood";
        paintSteps();
        await sleep(800);
        if (dead()) return;
        const r = applyDSL(state, lines[i]);
        const wasPlaying = state.music.playing;
        state = r.state;
        render();
        playEffects(r.effects);
        r.warnings.forEach(w => console.warn("[cabin]", w));
        if (state.music.playing !== wasPlaying) setRing(state.music.playing);
        const sc = $("panel-screen");
        sc.classList.add("speaking");
        clearTimeout(sc._t);
        sc._t = setTimeout(() => sc.classList.remove("speaking"), 1200);
        renderCards();
        cur.res[i] = { temp: state.ac.zone.lf.temp };
        cur.phase = "done";
        paintSteps();
        focusOn(targetsFor(lines[i]));
        if (i < lines.length - 1) {
            await sleep(2e3);
            if (dead()) return;
        }
    }
    logItems.push({ text: text, lines: lines });
    paintLog();
    busy = false;
}
function targetsFor(line) {
    const c = parseDSL(line)[0];
    if (!c || !c.tool) return [];
    const p = c.params, t = c.tool;
    if (t === "ac") {
        const z = p.zone;
        if (z === "windshield" || z === "all glass" || (!z && [ "defog", "defrost" ].includes(p.mode))) return [ "glass-front" ];
        if (z === "rear glass" || z === "rear window") return [ "glass-rear" ];
        if (z === "mirrors") return [ "mirror-l", "mirror-r" ];
        const zs = ZONE_TEMP[z] || ZONE_TEMP["whole car"];
        const m = {
            lf: "ac-front-l",
            rf: "ac-front-r",
            rear: "ac-rear"
        };
        return zs.map(k => m[k]);
    }
    if (t === "win") {
        const zs = ZONE_WIN[p.zone] || ZONE_WIN["all"];
        return zs.map(k => k === "sunroof" ? "win-sunroof" : "win-" + k);
    }
    if (t === "shade") {
        return (ZONE_SHADE[p.zone] || ZONE_SHADE["all"]).map(k => "shade-" + k);
    }
    if (t === "seat") {
        return (ZONE_SEAT[p.zone] || ZONE_SEAT["all"]).map(k => "seat-" + k);
    }
    if (t === "light") return [ "light-dash" ];
    if (t === "volume") return [ "spk-fl", "spk-fr" ];
    return [ "panel-screen" ];
}

    "win-lr": [ 70, 430, 22, 150 ],
    "win-rr": [ 308, 430, 22, 150 ],
    "light-dash": [ 92, 268, 216, 330 ],
    "ac-front-l": [ 100, 302, 92, 110 ],
    "ac-front-r": [ 208, 302, 92, 110 ],

function clearRings() {
    $("rings-car").innerHTML = "";
    $("rings-panel").innerHTML = "";
    $("pulseLayer").innerHTML = "";
}

function focusOn(ids) {
    clearRings();
    const made = [];
    [ ...new Set(ids) ].forEach(id => {
        const el = $(id);
        let b = BOX[id];
        if (!b && el && el.getBBox) {
            const q = el.getBBox();
            b = [ q.x, q.y, q.width, q.height ];
        }
        if (!b) return;
        const pad = id === "panel-screen" ? 0 : 4;
        const r = document.createElementNS(SVGNS, "rect");
        r.setAttribute("class", "ring");
        r.setAttribute("x", b[0] - pad);
        r.setAttribute("y", b[1] - pad);
        r.setAttribute("width", b[2] + pad * 2);
        r.setAttribute("height", b[3] + pad * 2);
        r.setAttribute("rx", id === "panel-screen" ? 11 : 9);
        $(id === "panel-screen" ? "rings-panel" : "rings-car").appendChild(r);
        made.push(r);
        if (id !== "panel-screen" && id !== "light-dash") flash(id);
    });
    pulseTo($("st3"), made);
}

function pulseTo(fromEl, els) {
    const layer = $("pulseLayer");
    layer.innerHTML = "";
    if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    const a = fromEl.getBoundingClientRect();
    els.forEach(el => {
        const b = el.getBoundingClientRect();
        const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
        const p = document.createElementNS(SVGNS, "path");
        if (b.top >= a.bottom - 2 && x1 > a.left && x1 < a.right) {
            /* target right under the result card: drop straight down from it */
            const x0 = Math.min(Math.max(x1, a.left + 24), a.right - 24), y0 = a.bottom, dy = Math.max(20, (y1 - y0) * .5);
            p.setAttribute("d", `M${x0} ${y0} C ${x0} ${y0 + dy}, ${x1} ${y1 - dy}, ${x1} ${y1}`);
        } else {
            const right = x1 > a.left + a.width / 2;
            const x0 = right ? a.right : a.left, y0 = a.top + a.height / 2;
            const dx = Math.max(30, Math.abs(x1 - x0) * .45) * (right ? 1 : -1);
            p.setAttribute("d", `M${x0} ${y0} C ${x0 + dx} ${y0}, ${x1 - dx} ${y1}, ${x1} ${y1}`);
        }
        layer.appendChild(p);
    });
    clearTimeout(layer._t);
    layer._t = setTimeout(() => {
        layer.querySelectorAll("path").forEach(p => p.style.opacity = 0);
        setTimeout(() => layer.innerHTML = "", 450);
    }, 1100);
}

/* ── step 2 in plain words: every part of the command becomes a small labelled chip ── */
const L2 = (en, zh) => lang === "zh" ? zh : en;

const TOOL = {
    seat: [ "Seat", "座椅" ], win: [ "Window", "车窗" ], shade: [ "Sunshade", "遮阳帘" ], light: [ "Ambient light", "氛围灯" ],
    ac: [ "A/C", "空调" ], nav: [ "Navigation", "导航" ], music: [ "Music", "音乐" ], general: [ "Screen", "屏幕" ],
    volume: [ "Volume", "音量" ], bt: [ "Phone", "电话" ], video: [ "Video", "视频" ], reject: [ "None", "无" ]
};

const KEYL = {
    action: [ "Action", "动作" ], zone: [ "Zone", "区域" ], mode: [ "Mode", "模式" ], degree: [ "Value", "数值" ], color: [ "Colour", "颜色" ],
    target: [ "Target", "对象" ], end: [ "To", "目的地" ], route: [ "Route", "路线" ], search: [ "Search", "搜索" ], distance: [ "Within", "范围" ],
    index: [ "Item", "序号" ], singer: [ "Artist", "歌手" ], song: [ "Song", "歌曲" ]
};

/* value → [English, Chinese]; anything missing is shown as the model wrote it */
const VALL = {
    "on": [ "turn on", "开启" ], "off": [ "turn off", "关闭" ], "set": [ "set", "设为" ], "increase": [ "raise", "调高" ], "decrease": [ "lower", "调低" ],
    "navigate": [ "navigate", "导航" ], "search": [ "search", "搜索" ], "play": [ "play", "播放" ], "favourite": [ "save", "收藏" ], "next": [ "next", "下一首" ],
    "item N": [ "pick", "选择" ], "unsupported": [ "unsupported", "不支持" ],
    "driver": [ "driver", "主驾" ], "passenger": [ "passenger", "副驾" ], "front left": [ "front left", "左前" ], "front right": [ "front right", "右前" ],
    "rear left": [ "rear left", "左后" ], "rear right": [ "rear right", "右后" ], "front row": [ "front", "前排" ], "rear row": [ "rear", "后排" ],
    "all": [ "all", "全部" ], "whole car": [ "whole car", "全车" ], "sunroof": [ "sunroof", "天窗" ], "windshield": [ "windshield", "前挡" ],
    "heating": [ "heating", "加热" ], "massage": [ "massage", "按摩" ], "ventilation": [ "ventilation", "通风" ], "colour": [ "colour", "颜色" ],
    "brightness": [ "brightness", "亮度" ], "defog": [ "defog", "除雾" ], "temperature": [ "temperature", "温度" ], "fan speed": [ "fan speed", "风量" ],
    "half": [ "half", "一半" ], "traffic": [ "traffic", "路况" ], "avoid highways": [ "avoid highways", "不走高速" ], "gas station": [ "gas station", "加油站" ],
    "km": [ "km", "公里" ], "blue": [ "blue", "蓝色" ], "red": [ "red", "红色" ], "green": [ "green", "绿色" ], "white": [ "white", "白色" ], "purple": [ "purple", "紫色" ],
    "Jay Chou": [ "Jay Chou", "周杰伦" ], "Qi Li Xiang": [ "Qi Li Xiang", "七里香" ], "Shenzhen North Station": [ "Shenzhen North Station", "深圳北站" ]
};

const vv = v => VALL[v] ? L2(VALL[v][0], VALL[v][1]) : v;

function chipsFor(line) {
    const c = parseDSL(line)[0];
    if (!c || !c.tool) return [];
    if (c.tool === "reject") return [ [ "dev", L2("Intent", "意图"), L2("not supported", "不支持") ] ];
    const p = c.params, opens = c.tool === "win" || c.tool === "shade";
    const out = [ [ "dev", L2("Device", "设备"), TOOL[c.tool] ? L2(TOOL[c.tool][0], TOOL[c.tool][1]) : c.tool ] ];
    for (const [k, v] of Object.entries(p)) {
        if (k === "unit" || c.tool === "reject") continue;
        let val = vv(v);
        if (k === "action" && opens && (v === "on" || v === "off")) val = v === "on" ? L2("open", "打开") : L2("close", "关闭");
        if (k === "distance") val = v + " " + vv(p.unit || "km");
        if (k === "degree" && p.target === "temperature") val = v + " °C";
        out.push([ "", KEYL[k] ? L2(KEYL[k][0], KEYL[k][1]) : k, val ]);
    }
    return out;
}

/* free-text values (a place, a song) are the ones the small LLM fills in */
const needsLLM = line => {
    const c = parseDSL(line)[0];
    return !!c && [ "end", "from", "song", "singer", "search", "name", "album" ].some(k => c.params[k] != null);
};

/* ── step 3 in plain words ── */
function describe(line, snap) {
    const c = parseDSL(line)[0] || { params: {} }, p = c.params, t = c.tool, zh = lang === "zh", a = p.action, on = a !== "off";
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const zEn = z => cap(vv(z).replace(/ (left|right)$/, "-$1"));
    const temp = snap && snap.temp != null ? snap.temp : p.degree;
    if (t === "seat") {
        const z = p.zone || "all", m = p.mode || "heating";
        return zh ? `${vv(z)}座椅${vv(m)}已${on ? "开启" : "关闭"}` : `${zEn(z)} seat ${m} ${on ? "on" : "off"}`;
    }
    if (t === "win") {
        const z = p.zone || "all";
        if (z === "sunroof") return zh ? `天窗已${on ? "打开" : "关闭"}` : `Sunroof ${on ? "opened" : "closed"}`;
        const name = zh ? (z === "all" ? "所有" : vv(z)) + "车窗" : z === "all" ? "All windows" : `${zEn(z)} window`;
        if (p.degree === "half") return zh ? `${name}已开一半` : `${name} half open`;
        return zh ? `${name}已${on ? "打开" : "关闭"}` : `${name} ${on ? "opened" : "closed"}`;
    }
    if (t === "shade") {
        const z = p.zone || "all";
        const name = zh ? (z === "all" ? "" : vv(z)) + "遮阳帘" : z === "all" ? "Sunshades" : `${zEn(z)} sunshade`;
        return zh ? `${name}已${on ? "打开" : "关闭"}` : `${name} ${on ? "opened" : "closed"}`;
    }
    if (t === "light") {
        if (p.color) return zh ? `氛围灯已变为${vv(p.color)}` : `Ambient light is now ${p.color}`;
        return zh ? `氛围灯已${on ? "开启" : "关闭"}` : `Ambient light ${on ? "on" : "off"}`;
    }
    if (t === "ac") {
        if (p.mode === "defog" || p.mode === "defrost") return zh ? `前挡除雾已${on ? "开启" : "关闭"}` : `Windshield defog ${on ? "on" : "off"}`;
        if (p.target === "temperature") {
            if (a === "decrease") return zh ? `温度已降到 ${temp} ℃` : `Temperature down to ${temp} °C`;
            if (a === "increase") return zh ? `温度已升到 ${temp} ℃` : `Temperature up to ${temp} °C`;
            return zh ? `温度已调到 ${temp} ℃` : `Temperature set to ${temp} °C`;
        }
        return zh ? `空调已${on ? "开启" : "关闭"}` : `A/C ${on ? "on" : "off"}`;
    }
    if (t === "nav") {
        if (p.end) return zh ? `正在导航去${vv(p.end)}` : `Navigating to ${p.end}`;
        if (p.target === "traffic") return zh ? "地图已显示路况" : "Traffic shown on the map";
        if (p.search) return zh ? `已列出附近的${vv(p.search)}` : `Nearby ${p.search}s listed`;
        return zh ? "导航已更新" : "Navigation updated";
    }
    if (t === "general") {
        if (p.index) return zh ? `已选择第 ${p.index} 个` : `Item ${p.index} selected`;
        return zh ? "已完成" : "Done";
    }
    if (t === "music") {
        if (a === "play") return zh ? `正在播放《${vv(p.song || p.singer || "")}》` : `Now playing ${p.song || p.singer || "music"}`;
        if (a === "favourite") return zh ? "已收藏这首歌" : "Song saved to favourites";
        if (a === "next") return zh ? `已切到下一首${p.singer ? vv(p.singer) + "的歌" : ""}` : `Next ${p.singer ? p.singer + " " : ""}song playing`;
        return zh ? "音乐已更新" : "Music updated";
    }
    if (t === "reject") return zh ? "离线演示里没有这句" : "Not in this offline demo";
    return zh ? "已完成" : "Done";
}

function paintSteps() {
    const ph = cur ? cur.phase : "idle";
    $("app").dataset.phase = ph;
    const cls = (id, on, was) => {
        $(id).classList.toggle("on", on);
        $(id).classList.toggle("was", was);
    };
    cls("st1", ph === "said", ph === "think" || ph === "understood" || ph === "done");
    cls("st2", ph === "think" || ph === "understood", ph === "done");
    cls("st3", ph === "done", false);
    const said = $("said");
    said.innerHTML = cur ? `<q>${esc(inLang(cur.text))}</q>` : `<span class="ph">${esc(T("ph1"))}</span>`;
    said.classList.toggle("in", !!(cur && cur.fresh));
    const line = cur && cur.lines[cur.li];
    const shown = !!line && (ph === "understood" || ph === "done");
    const chips = $("chips"), key = shown ? lang + "|" + line + "|" + cur.li + "|" + cur.text : ph === "think" ? "think" + lang : "ph" + lang + ph;
    if (chips.dataset.k !== key) {
        chips.dataset.k = key;
        chips.innerHTML = shown ? chipsFor(line).map(([c, k, v], i) => `<span class="chip ${c}" style="--i:${i}"><em>${esc(k)}</em>${esc(v)}</span>`).join("") : ph === "think" ? `<span class="think"><u><s></s><s></s><s></s></u>${esc(T("thinking"))}</span>` : `<span class="ph">${esc(ph === "idle" ? T("ph2") : T("wait"))}</span>`;
    }
    $("raw").innerHTML = shown ? `<span>DSL</span>${esc(line)}` : "";
    $("raw").title = shown ? line : "";
    const n = cur ? cur.lines.length : 0;
    $("cnt").hidden = !(shown && n > 1);
    $("cnt").textContent = n > 1 ? `${cur.li + 1}/${n}` : "";
    $("by").innerHTML = shown && cur.lines[0].indexOf("reject") !== 0 ? `<b>Mapika-2B</b>${needsLLM(line) ? " + Qwen3-1.7B" : ""}` : "";
    $("by").title = shown && needsLLM(line) ? "Qwen3-1.7B " + T("fills") : "";
    const res = $("result"), done = ph === "done" && !!line;
    const rkey = done ? lang + "|" + line + "|" + cur.li + "|" + cur.text : "ph" + lang + ph;
    if (res.dataset.k !== rkey) {

function buildQueue(p) {
    const mk = (song, singer, album) => ({
        song: song,
        singer: singer,
        album: album || ""
    });
    if (p.list) return {
        title: p.list,
        items: DEFAULT_Q.map(x => mk(...x))
    };
    if (p.album) {
        const sg = p.singer || Object.keys(CATALOG).find(k => CATALOG[k].some(x => x[1] === p.album));
        const items = sg ? CATALOG[sg].filter(x => x[1] === p.album).map(x => mk(x[0], sg, x[1])) : [];
        return {
            title: `Album · ${p.album}`,
            items: items.length ? items : [ mk(p.album, sg || "", p.album) ]
        };
    }
    if (p.name) {
        return {
            title: p.name,
            items: [ mk(`${p.name}${p.type ? " " + p.type : ""}`, "Soundtrack", p.name) ]
        };
    }
    if (p.singer) {
        const arr = CATALOG[p.singer] || [ [ "Songs by " + p.singer, "" ] ];
        let items = arr.map(x => mk(x[0], p.singer, x[1]));
        if (p.song) {
            const i = items.findIndex(x => x.song === p.song);
            if (i > 0) {
                const [it] = items.splice(i, 1);
                items.unshift(it);
            } else if (i < 0) items.unshift(mk(p.song, p.singer, ""));
        }
        return {
            title: `${p.singer}`,
            items: items
        };
    }
    if (p.song) {
        const sg = SONG2SINGER[p.song];
        const rest = sg ? CATALOG[sg].filter(x => x[0] !== p.song).map(x => mk(x[0], sg, x[1])) : DEFAULT_Q.map(x => mk(...x));
        return {
            title: p.song,
            items: [ mk(p.song, sg || "", sg ? (CATALOG[sg].find(x => x[0] === p.song) || [])[1] : ""), ...rest ]
        };
    }
    return {
        title: p.mode || "recommend",
        items: DEFAULT_Q.map(x => mk(...x))
    };
}

function setTrack(m, i) {
    m.pos = 0;

    if (!q || !q.items.length) return;
    const n = q.items.length;
    if (m.mode === "shuffle" && i !== m.idx) {
        i = Math.floor(Math.random() * n);
    }
    m.idx = (i % n + n) % n;
    const t = q.items[m.idx];
    m.song = t.song;
    m.singer = t.singer;
    m.album = t.album;
    m.track = m.idx + 1;
    m.dur = dur(t.song + t.singer);
    m.pos = 0;
    m.fav = false;
}

function genMap(seed) {
    let t = seed >>> 0 || 1;
    const R = () => {
        t ^= t << 13;
        t >>>= 0;
        t ^= t >> 17;
        t ^= t << 5;
        t >>>= 0;
        return t / 4294967296;
    };
    const rnd = (a, b) => a + (b - a) * R();
    const n = 5, pts = [];
    for (let i = 0; i < n; i++) {
        const x = 76 + i * (196 / (n - 1)) + (i > 0 && i < n - 1 ? rnd(-14, 14) : 0);
        const y = i === n - 1 ? rnd(128, 160) : rnd(124, 168);   /* the label band (y 176+) stays clear */
        pts.push([ Math.round(x), Math.round(y) ]);
    }
    if (R() < .5) pts.reverse().forEach(p => p[0] = 360 - p[0]);
    pts.forEach(p => {
        if (p[0] > 160) p[1] = Math.min(p[1], 170);
    });
    pts[n - 1][1] = Math.min(pts[n - 1][1], 168);
    const c = (a, b) => {
        const dx = (b[0] - a[0]) / 2;
        return `C ${a[0] + dx} ${a[1]} ${b[0] - dx} ${b[1]} ${b[0]} ${b[1]}`;
    };
    const seg = [];
    for (let i = 0; i < n - 1; i++) seg.push(`M${pts[i][0]} ${pts[i][1]} ${c(pts[i], pts[i + 1])}`);
    const route = `M${pts[0][0]} ${pts[0][1]} ` + pts.slice(1).map((q, i) => c(pts[i], q)).join(" ");
    const G = "#2fd1a8";
    let deco = `<g stroke="${G}" stroke-width=".6" opacity=".16"><path d="`;
    for (let y = 120 + rnd(0, 20); y < 222; y += rnd(26, 42)) deco += `M60 ${y.toFixed(0)} H300 `;
    for (let x = 80 + rnd(0, 30); x < 300; x += rnd(40, 64)) deco += `M${x.toFixed(0)} 112 V224 `;
    deco += '"/></g>';
    if (R() < .5) {
        const y0 = rnd(118, 140);
        deco += `<path d="M60 ${y0.toFixed(0)} C 120 ${(y0 + rnd(-10, 10)).toFixed(0)} 200 ${(y0 + rnd(-12, 12)).toFixed(0)} 300 ${(y0 + rnd(-8, 8)).toFixed(0)}" fill="none" stroke="#3f8cff" stroke-width="${rnd(7, 11).toFixed(0)}" opacity=".18"/><text x="${rnd(90, 220).toFixed(0)}" y="${(y0 + 14).toFixed(0)}" fill="#3f8cff" font-size="6" opacity=".6">${[ "Shenzhen River", "Dong River", "Xili Lake", "Dasha River" ][Math.floor(R() * 4)]}</text>`;
    }
    const NAMES = [ "Park", "School", "Hospital", "Mall", "Stadium", "Tech Park", "Metro", "Library" ];
    for (let k = 0, m = 1 + Math.floor(R() * 3); k < m; k++) {
        const x = rnd(70, 250), y = rnd(150, 200), w = rnd(30, 56), h = rnd(16, 30);
        deco += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="3" fill="${G}" opacity=".08"/><text x="${(x + 5).toFixed(0)}" y="${(y + 11).toFixed(0)}" fill="${G}" font-size="6" opacity=".5">${NAMES.splice(Math.floor(R() * NAMES.length), 1)[0]}</text>`;
    }
    return {
        route: route,
        seg: seg,
        me: pts[0],
        pin: pts[n - 1],
        deco: deco
    };
}

HANDLERS.nav = function(s, p, fx, warn) {
    norm(p, {
        "open": "on",
        "close": "off"
    });
    const n = s.nav, a = p.action || (p.end ? "navigate" : p.search ? "search" : "locate");
    const reroll = () => {
        n.map = 1 + Math.floor(Math.random() * 4294967294);
    };
    if (p.target === "traffic" && (a === "on" || a === "off" || a === "traffic")) {
        n.traffic = a !== "off";
        n.active = n.active || n.traffic;
        if (p.end && p.end !== n.dest) {
            reroll();
        }
        if (p.end) n.dest = p.end;
        s.screen = "nav";
        fx.push({
            kind: "nav"
        });
        return;
    }
    if (a === "traffic") {
        n.traffic = !n.traffic;
        n.active = true;
        if (p.end && p.end !== n.dest) {
            reroll();
        }
        if (p.end) n.dest = p.end;
        s.screen = "nav";
        touch(s, "nav");
        fx.push({
            kind: "nav"
        });
        return;
    }
    if (a === "locate") {
        n.located = true;
        n.active = true;
        s.screen = "nav";
        fx.push({
            kind: "status",
            title: "Current location",
            sub: p.target === "traffic" ? "Traffic nearby: clear · demo" : "Shennan Blvd · demo",
            icon: "◎",
            color: "#2fd1a8"
        });
        return;
    }
    if (a === "time left" || a === "distance left") {
        if (p.end && p.end !== n.dest) {
            reroll();
        }
        if (p.end) n.dest = p.end;
        n.active = true;
        n.remaining = a === "time left" ? "left 24 min" : "left 18 km";
        s.screen = "nav";
        fx.push({
            kind: "status",
            title: n.remaining,
            sub: `to ${n.dest || "Destination"}${p.target === "traffic" ? " · road ahead clear" : ""} · demo`,
            icon: "➤",
            color: "#2fd1a8"
        });
        return;
    }
    if (a === "search" && p.end && !p.search) {
        s.list = mkList("guide", `${p.end} guide`, Array.from({
            length: 8
        }, (_, i) => ({
            name: `${p.end}guide ${i + 1}`,
            meta: [ "3 days", "5 days", "weekend", "7 days" ][i % 4]
        })));
        n.search = p.end;
        s.screen = "list";
        touch(s, "nav");
        fx.push({
            kind: "list"
        });
        return;
    }
    if (a === "search" && !p.end) {
        const dist = p.distance ? `${p.distance} ${p.unit || "km"}` : "nearby";
        const what = p.search || "places";
        s.list = mkList("places", `${what} · ${dist}`, Array.from({
            length: 8
        }, (_, i) => ({
            name: `${what} ${i + 1}`,
            meta: `${(.4 + i * .7).toFixed(1)} km`
        })));
        n.search = what;
        if (p.route) n.route = p.route;
        s.screen = "list";
        touch(s, "nav");
        fx.push({
            kind: "list"
        });
        return;
    }
    if (a === "navigate" || a === "on" || a === "search") {
        const nd = p.end || (p.search ? p.search + " nearby" : n.dest || "Destination");
        if (nd !== n.dest || !n.active || p.start && p.start !== n.start || p.route && p.route !== n.route) reroll();
        n.active = true;
        n.dest = nd;
        if (p.start) n.start = p.start;
        if (p.route) n.route = p.route;
        n.remaining = "";
        s.screen = "nav";
        touch(s, "nav");
        fx.push({
            kind: "nav"
        });
        return;
    }
    if (a === "off") {
        n.active = false;
        n.traffic = false;
        if (s.screen === "nav") s.screen = "idle";
        fx.push({
            kind: "screen"
        });
        return;
    }
    warn.push(`nav: unknown action ${a}`);
};

const toSec = p => (Number(p.hour) || 0) * 3600 + (Number(p.minute) || 0) * 60 + (Number(p.second) || 0);

HANDLERS.video = function(s, p, fx, warn) {
    const a = p.action || "play";
    const v = s.video || (s.video = {
        name: "",
        ep: "",
        type: "",
        actor: "",
        source: "iQIYI",
        playing: false,
        pos: 0,
        dur: 5400
    });
    if (p.name) v.name = p.name;
    if (p.type) v.type = p.type;
    if (p.actor) v.actor = p.actor;
    if (p.source) v.source = p.source;
    if (a === "query") {
        const who = p.actor || p.name || "Trending";
        s.list = mkList("shows", `${who} · ${p.type || "shows"}`, Array.from({
            length: 6
        }, (_, i) => ({
            name: `${who}works ${i + 1}`,
            meta: p.type || ""
        })));
        s.screen = "list";
        fx.push({
            kind: "list"
        });
        return;
    }
    if (a === "play") {
        if (p.ep) v.ep = p.ep;
        if (!v.name) v.name = v.actor ? `${v.type || "film"} · ${v.actor}` : v.type || "video";
        v.playing = true;
        if (p.ep || p.name) v.pos = 0;
        {
            const d = toSec(p);
            if (d) v.pos = Math.min(v.dur, d);
        }
        s.screen = "video";
        touch(s, "video");
    } else if (a === "pause") {
        v.playing = false;
        s.screen = "video";
    } else if (a === "next episode" || a === "previous episode") {
        v.ep = String(Math.max(1, (Number(v.ep) || 1) + (a === "next episode" ? 1 : -1)));
        v.pos = 0;
        v.playing = true;
        s.screen = "video";
    } else if (a === "fast-forward" || a === "rewind") {
        let d = toSec(p);
        if (p.ep && !d) {
            v.ep = p.ep;
            v.pos = 0;
        } else {
            if (!d) d = 30;
            v.pos = Math.max(0, Math.min(v.dur, v.pos + (a === "fast-forward" ? d : -d)));
        }
        s.screen = "video";
    } else if (a === "settings") {
        if (p.ep) v.ep = p.ep;
        const d = toSec(p);
        if (d) v.pos = Math.min(v.dur, d);
        s.screen = "video";
    } else warn.push(`video: unknown action ${a}`);
    fx.push({
        kind: "video"
    });
};

HANDLERS.music = function(s, p, fx, warn) {
    const m = s.music, a = p.action || (p.mode ? "set" : "play");
    for (const k in p) if (p[k] === "") delete p[k];
    if (p.source) m.source = p.source;
    if (p.mode) m.mode = p.mode;
    if (p.list) m.list = p.list;
    const wantsNew = p.song || p.singer || p.album || p.list || p.name;
    if (a === "play") {
        if (wantsNew || !m.queue) {
            m.queue = buildQueue(p);
            setTrack(m, 0);
        }
        m.playing = true;
        s.screen = "music";
        touch(s, "music");
    } else if (a === "set") {
        s.screen = "music";
    } else if (a === "pause" || a === "stop") {
        m.playing = false;
    } else if (a === "next" || a === "skip") {
        if (!m.queue) {
            m.queue = buildQueue({});
        }
        setTrack(m, m.idx + 1);
        m.playing = true;
        s.screen = "music";
        fx.push({
            kind: "swipe",
            dir: 1
        });
    } else if (a === "previous") {
        if (!m.queue) {
            m.queue = buildQueue({});
        }
        setTrack(m, m.idx - 1);
        m.playing = true;
        s.screen = "music";
        fx.push({
            kind: "swipe",
            dir: -1
        });
    } else if (a === "favourite") {
        m.fav = true;
        s.screen = "music";
    } else if (a === "unfavourite" || a === "unfavourite") {
        m.fav = false;
        s.screen = "music";
    } else if (a === "show lyrics") {
        m.lyrics = true;
        s.screen = "music";
    } else if (a === "hide lyrics") {
        m.lyrics = false;
        s.screen = "music";
    } else if (a === "query") {
        fx.push({
            kind: "status",
            title: "Now playing",
            sub: `${m.song} · ${m.singer}${p.name ? " · " + p.name : ""}`,
            icon: "♪",
            color: "#ff6a8e"
        });
        return;
    } else warn.push(`music: unknown action ${a}`);
    fx.push({
        kind: "music"
    });
};

function closeKind(s, k) {
    if (k === "music") s.music.playing = false;
    if (k === "video" && s.video) s.video.playing = false;
    if (k === "nav") {
        s.nav.active = false;
        s.nav.traffic = false;
    }
    if (k === "phone") s.phone.active = false;
    if (s.screen === "status" || s.screen === k || k === "tour" && s.screen === "list" || s.screen === "list" && s.list && (k === "nav" && s.list.kind === "places" || k === "video" && s.list.kind === "shows" || k === "travel" && s.list.kind === "images")) s.screen = "idle";
}

HANDLERS.switch = function(s, p, fx, warn) {
    if (!p.target && p.action && ![ "on", "off" ].includes(p.action)) {
        p.target = p.action;
        p.action = "on";
    }
    if (!p.target) {
        warn.push("switch: missing target");
        return;
    }
    const on = p.action !== "off";
    s.apps[p.target] = on;
    if (p.target === "photos" || p.target === "gallery" || p.target === "photos") {
        if (on) {
            s.list = gallery("photos", 10);
            s.screen = "list";
            touch(s, "travel");
        } else if (s.screen === "list" && s.list && s.list.kind === "images") s.screen = "idle";
        fx.push({
            kind: "list"
        });
        return;
    }
    const k = BUILTIN[p.target];
    if (k) {
        if (on) {
            touch(s, k);
            s.screen = k;
        } else closeKind(s, k);
        fx.push({
            kind: "screen"
        });
        return;
    }
    if (on) {
        touch(s, "app", p.target);
        s.app = p.target;
        s.screen = "app";
    } else {
        s.recent = s.recent.filter(r => r.id !== "app:" + p.target);
        if (s.app === p.target) {
            s.app = null;
            if (s.screen === "app" || s.screen === "status") s.screen = "idle";
        }
    }
    fx.push({
        kind: "screen"
    });
};
